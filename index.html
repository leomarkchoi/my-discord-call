<!DOCTYPE html>
<html lang="lo">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MDC Hub — Voice, Chat &amp; Post</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Lao:wght@400;600;700&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    /* ຖ້າມີໄຟລ໌ຟອນ LaoSomvang.ttf ໃຫ້ວາງໄວ້ໃນໂຟນເດີ fonts/ ເພື່ອໃຫ້ສະແດງໄດ້ທຸກເຄື່ອງເທິງ GitHub Pages */
    @font-face {
      font-family: 'Lao Somvang';
      src: local('Lao Somvang'), local('LaoSomvang'), url('./fonts/LaoSomvang.ttf') format('truetype');
      font-display: swap;
    }

    :root {
      --bg-main: #111315;
      --bg-sidebar: #181b1f;
      --bg-surface: #1e2228;
      --bg-hover: #242931;
      --accent: #10b981;
      --accent-hover: #059669;
      --accent-soft: rgba(16, 185, 129, 0.14);
      --text-main: #f3f4f6;
      --text-muted: #8b949e;
      --danger: #ef4444;
      --warning: #f59e0b;
      --app-font: 'Inter', 'Lao Somvang', 'Noto Sans Lao', system-ui, sans-serif;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--app-font);
      background: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
    }
    .hidden { display: none !important; }

    /* ================= AUTH GATE (@mdc.http) ================= */
    .auth-overlay {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      background: radial-gradient(circle at top right, #132722 0%, var(--bg-main) 50%);
    }
    .auth-card {
      width: 100%;
      max-width: 420px;
      background: var(--bg-sidebar);
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
    }
    .brand {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    .brand-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 18px;
      font-weight: 700;
    }
    .brand-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 12px var(--accent);
    }
    .domain-pill {
      font-family: ui-monospace, SFMono-Regular, monospace;
      font-size: 12px;
      color: var(--accent);
      background: var(--accent-soft);
      padding: 4px 10px;
      border-radius: 999px;
    }
    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: var(--bg-surface);
      border-radius: 10px;
      padding: 4px;
      margin-bottom: 20px;
      gap: 4px;
    }
    .tab-btn {
      background: transparent;
      color: var(--text-muted);
      border: none;
      border-radius: 8px;
      padding: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .tab-btn.active {
      background: var(--bg-sidebar);
      color: var(--text-main);
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 14px;
    }
    .form-group label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
    }
    .mdc-email-wrap {
      display: flex;
      align-items: center;
      background: var(--bg-surface);
      border-radius: 10px;
      overflow: hidden;
    }
    .mdc-email-wrap:focus-within { background: var(--bg-hover); }
    .mdc-email-wrap input { background: transparent; flex: 1; min-width: 0; }
    .mdc-suffix {
      padding: 0 12px 0 6px;
      font-family: ui-monospace, SFMono-Regular, monospace;
      font-size: 13px;
      color: var(--accent);
      user-select: none;
    }
    .email-preview {
      font-size: 12px;
      color: var(--text-muted);
      font-family: ui-monospace, SFMono-Regular, monospace;
      min-height: 16px;
    }
    .row-between {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 4px 0 16px;
      font-size: 12px;
      color: var(--text-muted);
    }
    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }
    .checkbox-label input { width: auto; accent-color: var(--accent); }
    .alert {
      display: none;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 14px;
    }
    .alert.show { display: block; }
    .alert.error { background: rgba(239, 68, 68, 0.14); color: #fca5a5; }
    .alert.success { background: var(--accent-soft); color: #6ee7b7; }

    /* ================= WORKSPACE ================= */
    .app-shell {
      display: grid;
      grid-template-columns: 270px 1fr;
      height: 100vh;
    }
    .sidebar {
      background: var(--bg-sidebar);
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .server-header, .my-id-box, .user-footer {
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .font-bar {
      padding: 0 14px 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .font-bar select {
      flex: 1;
      padding: 6px 10px;
      font-size: 12px;
    }
    .id-text {
      color: var(--accent);
      font-family: ui-monospace, SFMono-Regular, monospace;
      font-weight: 600;
      font-size: 12px;
      word-break: break-all;
    }
    .channel-tree {
      flex: 1;
      overflow-y: auto;
      padding: 6px 10px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .cat-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--text-muted);
      padding: 12px 8px 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .cat-add {
      background: transparent;
      color: var(--text-muted);
      padding: 2px 7px;
      font-size: 14px;
    }
    .cat-add:hover { background: var(--bg-hover); color: var(--text-main); }
    .channel-item {
      padding: 8px 10px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      color: var(--text-muted);
      user-select: none;
    }
    .channel-item:hover:not(.locked) { background: var(--bg-surface); color: var(--text-main); }
    .channel-item.active { background: var(--bg-surface); color: var(--accent); font-weight: 600; }
    .channel-item.is-sub {
      margin-left: 16px;
      font-size: 13px;
      border-left: 2px solid var(--bg-hover);
      border-radius: 0 8px 8px 0;
    }
    .channel-item.locked { opacity: 0.5; cursor: not-allowed; }
    .badge {
      font-size: 11px;
      padding: 2px 7px;
      border-radius: 6px;
      background: var(--bg-main);
      color: var(--text-muted);
    }
    .user-footer {
      background: var(--bg-main);
      margin: 10px;
      border-radius: 10px;
      flex-direction: column;
      align-items: stretch;
      gap: 6px;
    }
    .user-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .user-email-mini {
      font-size: 11px;
      color: var(--accent);
      font-family: ui-monospace, SFMono-Regular, monospace;
      word-break: break-all;
    }

    /* Main Stage */
    .main-stage {
      display: flex;
      flex-direction: column;
      background: var(--bg-main);
      min-height: 0;
    }
    .stage-header {
      padding: 12px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      background: var(--bg-sidebar);
    }
    .stage-header h2 { margin: 0; font-size: 16px; }
    .stage-sub { font-size: 12px; color: var(--text-muted); }

    /* Top Floating Audio Pill (Non-Discord layout) */
    .audio-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--bg-main);
      padding: 5px;
      border-radius: 10px;
      flex-wrap: wrap;
    }
    .stage-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    /* Inputs & Buttons */
    input, textarea, select {
      padding: 10px 12px;
      border-radius: 10px;
      border: none;
      background: var(--bg-surface);
      color: var(--text-main);
      font-size: 13px;
      font-family: inherit;
      outline: none;
    }
    input:focus, textarea:focus, select:focus { background: var(--bg-hover); }
    button {
      background: var(--accent);
      color: #05261c;
      border: none;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: 0.15s;
    }
    button:hover:not(:disabled) { background: var(--accent-hover); color: #fff; }
    .btn-full { width: 100%; padding: 11px; font-size: 14px; }
    .btn-small { padding: 5px 9px; font-size: 12px; background: var(--bg-surface); color: var(--text-main); }
    .btn-small:hover { background: var(--bg-hover); color: #fff; }
    .btn-mute { background: var(--bg-surface); color: var(--text-main); font-size: 12px; padding: 6px 10px; }
    .btn-mute.is-on { background: var(--accent-soft); color: var(--accent); }
    .btn-hangup { background: var(--danger); color: #fff; }
    .btn-hangup:hover { background: #dc2626; }

    /* Voice Room */
    .quick-call { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .voice-grid {
      padding: 14px 18px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 10px;
      background: var(--bg-sidebar);
    }
    .member-card {
      background: var(--bg-surface);
      border-radius: 10px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 13px;
    }
    .member-top { display: flex; justify-content: space-between; align-items: center; gap: 6px; }

    /* Chat Room (Clean Hover-Only Actions) */
    .chat-feed {
      flex: 1;
      overflow-y: auto;
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .msg-item {
      background: transparent;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.5;
      transition: background 0.12s;
    }
    .msg-item:hover { background: var(--bg-sidebar); }
    .msg-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }
    .msg-meta { font-size: 12px; color: var(--text-muted); }
    .msg-meta strong { color: var(--accent); margin-right: 6px; font-weight: 600; }
    .msg-reply-ref {
      font-size: 12px;
      color: var(--text-muted);
      background: var(--bg-surface);
      padding: 4px 8px;
      border-left: 3px solid var(--accent);
      border-radius: 4px;
      margin-bottom: 6px;
    }
    .msg-actions { display: flex; gap: 6px; margin-top: 6px; align-items: center; }
    .msg-top .btn-small, .msg-actions .hover-only { opacity: 0; transition: opacity 0.15s; }
    .msg-item:hover .msg-top .btn-small, .msg-item:hover .msg-actions .hover-only { opacity: 1; }
    .react-btn {
      background: var(--bg-surface);
      color: var(--text-main);
      padding: 3px 8px;
      font-size: 12px;
      border-radius: 12px;
    }
    .react-btn:hover { background: var(--bg-hover); }
    .reply-banner {
      padding: 8px 16px;
      background: var(--bg-sidebar);
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .chat-input-bar {
      padding: 12px 18px 16px;
      display: flex;
      gap: 8px;
      background: var(--bg-main);
    }
    .chat-input-bar input { flex: 1; padding: 12px 14px; }

    /* Post / Forum Room */
    .post-layout {
      flex: 1;
      overflow-y: auto;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .post-composer {
      background: var(--bg-sidebar);
      padding: 14px;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .post-composer-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .post-composer-row input { flex: 1; min-width: 180px; }
    .tag-bar { display: flex; gap: 6px; flex-wrap: wrap; }
    .tag-pill {
      background: var(--bg-sidebar);
      color: var(--text-muted);
      padding: 5px 12px;
      border-radius: 14px;
      font-size: 12px;
    }
    .tag-pill.active { background: var(--accent); color: #05261c; }
    .post-card {
      background: var(--bg-sidebar);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .post-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
    .post-title { margin: 0; font-size: 16px; color: var(--text-main); }
    .post-body { margin: 0; font-size: 14px; color: #d1d5db; white-space: pre-wrap; line-height: 1.55; }
    .post-img { max-width: 100%; max-height: 280px; border-radius: 10px; object-fit: cover; }
    .post-footer { display: flex; gap: 10px; align-items: center; }
    .comment-box {
      background: var(--bg-main);
      border-radius: 10px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .comment-item { font-size: 13px; color: #d1d5db; }
    .comment-form { display: flex; gap: 6px; }
    .comment-form input { flex: 1; padding: 8px 10px; }

    @media (max-width: 768px) {
      .app-shell { grid-template-columns: 1fr; }
      .sidebar { max-height: 40vh; }
    }
  </style>
</head>
<body>

  <!-- ================= AUTH GATE SCREEN ================= -->
  <section id="auth-gate" class="auth-overlay">
    <main class="auth-card">
      <div class="brand">
        <div class="brand-title">
          <span class="brand-dot"></span>
          <span>MDC Access</span>
        </div>
        <span class="domain-pill">@mdc.http</span>
      </div>

      <div id="auth-alert" class="alert"></div>

      <div class="tabs">
        <button type="button" id="tab-login" class="tab-btn active" onclick="switchAuthTab('login')">ເຂົ້າສູ່ລະບົບ (Log In)</button>
        <button type="button" id="tab-register" class="tab-btn" onclick="switchAuthTab('register')">ສ້າງບັນຊີ (Register)</button>
      </div>

      <form id="form-login" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label for="login-handle">ອີເມວ MDC</label>
          <div class="mdc-email-wrap">
            <input id="login-handle" type="text" placeholder="username" autocomplete="username" required />
            <span class="mdc-suffix">@mdc.http</span>
          </div>
        </div>
        <div class="form-group">
          <label for="login-password">ລະຫັດຜ່ານ</label>
          <input id="login-password" type="password" placeholder="••••••••" autocomplete="current-password" required />
        </div>
        <div class="row-between">
          <label class="checkbox-label">
            <input id="remember-me" type="checkbox" checked />
            ຈື່ການເຂົ້າສູ່ລະບົບໄວ້
          </label>
          <span>Font: Eng + Lao Somvang</span>
        </div>
        <button type="submit" class="btn-full">ເຂົ້າສູ່ລະບົບ</button>
      </form>

      <form id="form-register" class="hidden" onsubmit="handleRegister(event)">
        <div class="form-group">
          <label for="reg-display">ຊື່ສະແດງໃນຫ້ອງ (Display Name)</label>
          <input id="reg-display" type="text" placeholder="ເຊັ່ນ Anoulak" required />
        </div>
        <div class="form-group">
          <label for="reg-handle">ຕັ້ງອີເມວດັດແປງ (Name@mdc.http)</label>
          <div class="mdc-email-wrap">
            <input id="reg-handle" type="text" placeholder="name.dev" oninput="updateEmailPreview()" required />
            <span class="mdc-suffix">@mdc.http</span>
          </div>
          <div id="reg-preview" class="email-preview">ຕົວຢ່າງ: name.dev@mdc.http</div>
        </div>
        <div class="form-group">
          <label for="reg-password">ລະຫັດຜ່ານ (ຢ່າງໜ້ອຍ 6 ຕົວ)</label>
          <input id="reg-password" type="password" placeholder="••••••••" minlength="6" required />
        </div>
        <div class="form-group">
          <label for="reg-confirm">ຢືນຢັນລະຫັດຜ່ານ</label>
          <input id="reg-confirm" type="password" placeholder="••••••••" minlength="6" required />
        </div>
        <button type="submit" class="btn-full">ສ້າງບັນຊີໃໝ່ (Create Account)</button>
      </form>
    </main>
  </section>

  <!-- ================= MAIN HUB WORKSPACE ================= -->
  <div id="app-workspace" class="app-shell hidden">
    <aside class="sidebar">
      <div class="server-header">
        <div class="brand-title" style="font-size: 15px;">
          <span class="brand-dot"></span>
          <span>MDC Hub</span>
        </div>
        <span class="badge">v0.3</span>
      </div>

      <div class="font-bar">
        <span class="stage-sub">Font:</span>
        <select id="font-selector" onchange="applyFontPreset(this.value)" aria-label="ເລືອກ Font">
          <option value="eng_somvang">Eng + Lao Somvang</option>
          <option value="somvang_only">Lao Somvang</option>
          <option value="noto_lao">Eng + Noto Sans Lao</option>
        </select>
      </div>

      <div class="my-id-box">
        <span>ID: <span id="my-peer-id" class="id-text">ກຳລັງເຊື່ອມຕໍ່...</span></span>
        <button type="button" class="btn-small" onclick="copyId()">Copy</button>
      </div>

      <nav id="channel-tree" class="channel-tree" aria-label="Channels"></nav>

      <div class="user-footer">
        <div class="user-meta">
          <strong id="sidebar-user-name" style="font-size: 13px;">User</strong>
          <button type="button" class="btn-small" onclick="handleLogout()">ອອກ</button>
        </div>
        <div id="sidebar-user-email" class="user-email-mini">user@mdc.http</div>
      </div>
    </aside>

    <main class="main-stage">
      <header class="stage-header">
        <div>
          <h2 id="active-channel-title">General Voice</h2>
          <div id="active-channel-sub" class="stage-sub">ພ້ອມໃຊ້ງານ</div>
        </div>

        <div class="quick-call">
          <div class="audio-pill">
            <button type="button" id="btn-mute" class="btn-mute" onclick="toggleMute()">🔇 ປິດໄມ</button>
            <button type="button" id="btn-deafen" class="btn-mute" onclick="toggleDeafen()">🎧 ສຽງເປີດ</button>
            <button type="button" id="btn-ptt" class="btn-mute" onclick="togglePTT()">PTT: Off</button>
          </div>
          <div id="header-actions" class="quick-call"></div>
        </div>
      </header>

      <div id="stage-body" class="stage-body"></div>
    </main>
  </div>

  <audio id="remote-audio" autoplay></audio>

  <script>
    /* ================= FONT SELECTOR ================= */
    const FONT_KEY = "mdc_font_preset_v1";
    const FONT_PRESETS = {
      eng_somvang: "'Inter', 'Lao Somvang', 'Noto Sans Lao', system-ui, sans-serif",
      somvang_only: "'Lao Somvang', 'Noto Sans Lao', sans-serif",
      noto_lao: "'Inter', 'Noto Sans Lao', system-ui, sans-serif"
    };

    function applyFontPreset(presetKey) {
      const stack = FONT_PRESETS[presetKey] || FONT_PRESETS.eng_somvang;
      document.documentElement.style.setProperty("--app-font", stack);
      localStorage.setItem(FONT_KEY, presetKey);
      const sel = document.getElementById("font-selector");
      if (sel) sel.value = presetKey;
    }

    applyFontPreset(localStorage.getItem(FONT_KEY) || "eng_somvang");

    /* ================= AUTH (@mdc.http) ================= */
    const DOMAIN = "@mdc.http";
    const USERS_KEY = "mdc_users_v1";
    const SESSION_KEY = "mdc_current_session_v1";

    function normalizeMdcEmail(raw) {
      let clean = raw.trim().toLowerCase();
      if (clean.endsWith(DOMAIN)) clean = clean.slice(0, -DOMAIN.length);
      const valid = /^[a-z0-9._-]{3,32}$/.test(clean);
      return { valid, handle: clean, email: clean ? clean + DOMAIN : "" };
    }

    function updateEmailPreview() {
      const val = document.getElementById("reg-handle").value;
      const preview = document.getElementById("reg-preview");
      if (!val.trim()) {
        preview.textContent = "ຕົວຢ່າງ: name.dev@mdc.http";
        preview.style.color = "var(--text-muted)";
        return;
      }
      const res = normalizeMdcEmail(val);
      if (res.valid) {
        preview.textContent = "✓ ໃຊ້ໄດ້: " + res.email;
        preview.style.color = "var(--accent)";
      } else {
        preview.textContent = "✕ ໃຊ້ໄດ້ສະເພາະ a-z, 0-9, . _ - (3–32 ຕົວ)";
        preview.style.color = "var(--warning)";
      }
    }

    async function hashPassword(password) {
      const data = new TextEncoder().encode(password);
      const hashBuffer = await crypto.subtle.digest("SHA-256", data);
      return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, "0")).join("");
    }

    function getStoredUsers() {
      try { return JSON.parse(localStorage.getItem(USERS_KEY) || "[]"); }
      catch { return []; }
    }

    function getSession() {
      const raw = localStorage.getItem(SESSION_KEY) || sessionStorage.getItem(SESSION_KEY);
      try { return raw ? JSON.parse(raw) : null; }
      catch { return null; }
    }

    function setSession(user, remember) {
      const payload = JSON.stringify({
        id: user.id,
        displayName: user.displayName,
        email: user.email,
        role: user.role,
        joinPower: user.joinPower,
        movePower: user.movePower
      });
      if (remember) localStorage.setItem(SESSION_KEY, payload);
      else sessionStorage.setItem(SESSION_KEY, payload);
    }

    function showAuthAlert(msg, type = "error") {
      const box = document.getElementById("auth-alert");
      box.textContent = msg;
      box.className = `alert show ${type}`;
    }

    function switchAuthTab(mode) {
      document.getElementById("auth-alert").className = "alert";
      const isLogin = mode === "login";
      document.getElementById("tab-login").classList.toggle("active", isLogin);
      document.getElementById("tab-register").classList.toggle("active", !isLogin);
      document.getElementById("form-login").classList.toggle("hidden", !isLogin);
      document.getElementById("form-register").classList.toggle("hidden", isLogin);
    }

    async function handleRegister(event) {
      event.preventDefault();
      const displayName = document.getElementById("reg-display").value.trim();
      const parsed = normalizeMdcEmail(document.getElementById("reg-handle").value);
      const password = document.getElementById("reg-password").value;
      const confirm = document.getElementById("reg-confirm").value;

      if (!parsed.valid) return showAuthAlert("ຊື່ອີເມວບໍ່ຖືກຕ້ອງ (ໃຊ້ a-z, 0-9, . _ - 3–32 ຕົວ)");
      if (password !== confirm) return showAuthAlert("ລະຫັດຜ່ານ ແລະ ການຢືນຢັນບໍ່ກົງກັນ");

      const users = getStoredUsers();
      if (users.some(u => u.email === parsed.email)) return showAuthAlert(`ອີເມວ ${parsed.email} ມີຜູ້ໃຊ້ແລ້ວ`);

      const newUser = {
        id: "u_" + Date.now(),
        displayName,
        email: parsed.email,
        passwordHash: await hashPassword(password),
        role: "Member",
        joinPower: 50,
        movePower: 50
      };
      users.push(newUser);
      localStorage.setItem(USERS_KEY, JSON.stringify(users));
      setSession(newUser, true);
      bootWorkspace();
    }

    async function handleLogin(event) {
      event.preventDefault();
      const parsed = normalizeMdcEmail(document.getElementById("login-handle").value);
      const password = document.getElementById("login-password").value;
      const remember = document.getElementById("remember-me").checked;

      if (!parsed.valid) return showAuthAlert("ຮູບແບບອີເມວ @mdc.http ບໍ່ຖືກຕ້ອງ");
      const user = getStoredUsers().find(u => u.email === parsed.email);
      if (!user) return showAuthAlert(`ບໍ່ພົບບັນຊີ ${parsed.email}`);
      if (user.passwordHash !== await hashPassword(password)) return showAuthAlert("ລະຫັດຜ່ານບໍ່ຖືກຕ້ອງ");

      setSession(user, remember);
      bootWorkspace();
    }

      localStorage.removeItem(SESSION_KEY);
      sessionStorage.removeItem(SESSION_KEY);
      hangUp();
      document.getElementById("app-workspace").classList.add("hidden");

    let peer = null;
    let localStream = null;
    let currentCall = null;

    function initPeer() {
      if (peer) return;
      peer = new Peer();
      peer.on("open", id => {
        document.getElementById("my-peer-id").innerText = id;
      });
      peer.on("error", err => {
        state.callStatus = "Error: " + err.type;
        renderStageHeader();
      });
      peer.on("call", async call => {
        try {
          state.callStatus = "ກຳລັງຮັບສາຍ...";
          renderStageHeader();
          localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
          applyAudioTrackStates();
          call.answer(localStream);
          setupCallEvents(call);
        } catch (err) {
          alert("ບໍ່ສາມາດເປີດໄມໂຄຣໂຟນໄດ້: " + err.message);
        }
      });
    }

    function escapeHtml(str) {
      return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    function nowTime() {
      return new Date().toLocaleTimeString("lo-LA", { hour: "2-digit", minute: "2-digit" });
    }

    async function startCall() {
      const input = document.getElementById("remote-id-input");
      const friendId = input ? input.value.trim() : "";
      if (!friendId) return alert("ກະລຸນາໃສ່ ID ຂອງໝູ່");
      try {
        state.callStatus = "ກຳລັງໂທຫາ...";
        renderStageHeader();
        localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        applyAudioTrackStates();
        const call = peer.call(friendId, localStream);
        setupCallEvents(call);
      } catch (err) {
        alert("ບໍ່ສາມາດເປີດໄມໂຄຣໂຟນໄດ້: " + err.message);
      }
    }

    function setupCallEvents(call) {
      currentCall = call;
      state.inCall = true;
      renderStageHeader();
      call.on("stream", remoteStream => {
        const audioEl = document.getElementById("remote-audio");
        audioEl.srcObject = remoteStream;
        audioEl.muted = state.isDeafened;
        state.callStatus = "🟢 ເຊື່ອມຕໍ່ສຽງສຳເລັດ";
        renderStageHeader();
      });
      call.on("close", resetCallUI);
    }

    function hangUp() {
      if (currentCall) currentCall.close();
      resetCallUI();
    }

    function resetCallUI() {
      if (localStream) localStream.getTracks().forEach(t => t.stop());
      currentCall = null;
      state.inCall = false;
      state.callStatus = "ວາງສາຍແລ້ວ";
      renderStageHeader();
    }

    function applyAudioTrackStates() {
      if (!localStream) return;
      const track = localStream.getAudioTracks()[0];
      if (!track) return;
      track.enabled = state.isPTT ? (!state.isMuted && state.pttPressed) : !state.isMuted;
    }

    function toggleMute() {
      state.isMuted = !state.isMuted;
      applyAudioTrackStates();
      const btn = document.getElementById("btn-mute");
      btn.innerText = state.isMuted ? "🔊 ເປີດໄມ" : "🔇 ປິດໄມ";
      btn.classList.toggle("is-on", state.isMuted);
      renderStageBody();
    }

    function toggleDeafen() {
      state.isDeafened = !state.isDeafened;
      document.getElementById("remote-audio").muted = state.isDeafened;
      const btn = document.getElementById("btn-deafen");
      btn.innerText = state.isDeafened ? "🔇 ສຽງປິດ" : "🎧 ສຽງເປີດ";
      btn.classList.toggle("is-on", state.isDeafened);
      renderStageBody();
    }

    function togglePTT() {
      state.isPTT = !state.isPTT;
      state.pttPressed = false;
      applyAudioTrackStates();
      const btn = document.getElementById("btn-ptt");
      btn.innerText = state.isPTT ? "PTT: On (Space)" : "PTT: Off";
      btn.classList.toggle("is-on", state.isPTT);
    }

    window.addEventListener("keydown", e => {
      const tag = document.activeElement.tagName;
      if (state.isPTT && e.code === "Space" && tag !== "INPUT" && tag !== "TEXTAREA") {
        e.preventDefault();
        state.pttPressed = true;
        applyAudioTrackStates();
      }
    });
    window.addEventListener("keyup", e => {
      if (state.isPTT && e.code === "Space") {
        state.pttPressed = false;
        applyAudioTrackStates();
      }
    });

    function copyId() {
      const id = document.getElementById("my-peer-id").innerText;
      navigator.clipboard.writeText(id);
      alert("ກັອບປີ້ ID ແລ້ວ: " + id);
    }

    function canExecute(actorId, action, { targetId = null, targetChannelId = null } = {}) {
      const actor = state.users[actorId];
      if (!actor) return { allowed: false, reason: "ບໍ່ພົບຜູ້ໃຊ້" };
      if (action === "join_channel") {
        const ch = state.channels.find(c => c.id === targetChannelId);
        if (!ch) return { allowed: false, reason: "ບໍ່ພົບຫ້ອງ" };
        return actor.joinPower >= ch.neededJoinPower
          ? { allowed: true }
          : { allowed: false, reason: `ຕ້ອງການ Join Power ${ch.neededJoinPower}` };
      }
      if (action === "move_client") {
        const target = state.users[targetId];
        const ch = state.channels.find(c => c.id === targetChannelId);
        if (!target || !ch) return { allowed: false, reason: "ຂໍ້ມູນບໍ່ຄົບ" };
        return (actor.movePower >= target.neededMovePower && actor.joinPower >= ch.neededJoinPower)
          ? { allowed: true }
          : { allowed: false, reason: "Move/Join Power ບໍ່ພຽງພໍ" };
      }
      return { allowed: false, reason: "Unknown action" };
    }

    function selectChannel(channelId) {
      const check = canExecute(state.currentUserId, "join_channel", { targetChannelId: channelId });
      if (!check.allowed) return alert("ເຂົ້າຫ້ອງບໍ່ໄດ້: " + check.reason);
      state.activeChannelId = channelId;
      state.replyTo = null;
      state.activePostTag = "All";
      renderAll();
    }

    function addChannel(type) {
      const label = type === "voice" ? "ຫ້ອງໂທ/Sub-channel" : type === "text" ? "ຫ້ອງແຊັດ" : "ຫ້ອງໂພສ";
      const name = prompt(`ຊື່ ${label} ໃໝ່:`);
      if (!name || !name.trim()) return;
      let parentId = null;
      if (type === "voice") {
        const active = state.channels.find(c => c.id === state.activeChannelId);
        if (active && active.type === "voice") parentId = active.parentId || active.id;
      }
      const id = `ch_${type}_${Date.now()}`;
      state.channels.push({ id, type, parentId, name: name.trim(), desc: `ສ້າງໃໝ່ (${label})`, neededJoinPower: type === "voice" ? 10 : 0 });
      if (type === "post") state.postsByChannel[id] = [];
      else state.messagesByChannel[id] = [{ id: "sys_" + Date.now(), sender: "System", time: nowTime(), text: `ສ້າງຫ້ອງ "${name.trim()}" ແລ້ວ`, reply: null, reactions: {} }];
      state.activeChannelId = id;
      renderAll();
    }

    function sendChatMessage(event) {
      event.preventDefault();
      const input = document.getElementById("chat-input");
      const text = input.value.trim();
      if (!text) return;
      const list = state.messagesByChannel[state.activeChannelId] || [];
      list.push({ id: "m_" + Date.now(), sender: state.users.me.name, time: nowTime(), text, reply: state.replyTo, reactions: {} });
      state.messagesByChannel[state.activeChannelId] = list;
      state.replyTo = null;
      input.value = "";
      renderStageBody();
    }

    function setReplyTo(msgId) {
      const target = (state.messagesByChannel[state.activeChannelId] || []).find(m => m.id === msgId);
      if (!target) return;
      state.replyTo = { sender: target.sender, text: target.text };
      renderStageBody();
      const input = document.getElementById("chat-input");
      if (input) input.focus();
    }

    function clearReply() { state.replyTo = null; renderStageBody(); }

    function toggleReaction(msgId, emoji) {
      const msg = (state.messagesByChannel[state.activeChannelId] || []).find(m => m.id === msgId);
      if (!msg) return;
      msg.reactions[emoji] = (msg.reactions[emoji] || 0) + 1;
      renderStageBody();
    }

    function moveGuestToActiveChannel() {
      const check = canExecute(state.currentUserId, "move_client", { targetId: "peer_guest", targetChannelId: state.activeChannelId });
      if (!check.allowed) return alert("ຍ້າຍບໍ່ໄດ້: " + check.reason);
      const list = state.messagesByChannel[state.activeChannelId] || [];
      list.push({ id: "m_" + Date.now(), sender: "System", time: nowTime(), text: "ຍ້າຍ Guest Member ເຂົ້າຫ້ອງນີ້ສຳເລັດ", reply: null, reactions: {} });
      state.messagesByChannel[state.activeChannelId] = list;
      renderStageBody();
    }

    function createPost(event) {
      event.preventDefault();
      const title = document.getElementById("post-title").value.trim();
      const body = document.getElementById("post-body").value.trim();
      const tag = document.getElementById("post-tag").value;
      const imageUrl = document.getElementById("post-img").value.trim();
      if (!title || !body) return alert("ກະລຸນາໃສ່ຫົວຂໍ້ ແລະ ເນື້ອຫາໂພສ");
      const list = state.postsByChannel[state.activeChannelId] || [];
      list.unshift({ id: "p_" + Date.now(), author: state.users.me.name, time: nowTime(), tag, title, body, imageUrl, likes: 0, likedByMe: false, comments: [] });
      state.postsByChannel[state.activeChannelId] = list;
      renderStageBody();
    }

    function toggleLikePost(postId) {
      const post = (state.postsByChannel[state.activeChannelId] || []).find(p => p.id === postId);
      if (!post) return;
      post.likedByMe = !post.likedByMe;
      post.likes += post.likedByMe ? 1 : -1;
      renderStageBody();
    }

    function addComment(event, postId) {
      event.preventDefault();
      const input = event.target.querySelector("input");
      const text = input.value.trim();
      if (!text) return;
      const post = (state.postsByChannel[state.activeChannelId] || []).find(p => p.id === postId);
      if (!post) return;
      post.comments.push({ author: state.users.me.name, text });
      renderStageBody();
    }

    function setPostTagFilter(tag) { state.activePostTag = tag; renderStageBody(); }

    function renderChannelTree() {
      const nav = document.getElementById("channel-tree");
      nav.innerHTML = "";
      const me = state.users.me;
      const groups = [
        { type: "text", title: "ຫ້ອງແຊັດ (Text)", icon: "•" },
        { type: "post", title: "ຫ້ອງໂພສ (Forum)", icon: "▤" },
        { type: "voice", title: "ຫ້ອງໂທສຽງ (Voice)", icon: "◉" }
      ];
      groups.forEach(group => {
        const header = document.createElement("div");
        header.className = "cat-label";
        header.innerHTML = `<span>${group.title}</span><button type="button" class="cat-add" onclick="addChannel('${group.type}')">+</button>`;
        nav.appendChild(header);

        const renderLevel = (parentId) => {
          state.channels.filter(c => c.type === group.type && c.parentId === parentId).forEach(ch => {
            const locked = me.joinPower < ch.neededJoinPower;
            const div = document.createElement("div");
            div.className = `channel-item ${ch.parentId ? "is-sub" : ""} ${ch.id === state.activeChannelId ? "active" : ""} ${locked ? "locked" : ""}`;
            div.onclick = () => selectChannel(ch.id);
            div.innerHTML = `
              <span>${ch.parentId ? "↳ " : group.icon + " "}${escapeHtml(ch.name)}</span>
              ${ch.type === "voice" ? `<span class="badge">${locked ? "🔒 " + ch.neededJoinPower : "JP " + ch.neededJoinPower}</span>` : ""}
            `;
            nav.appendChild(div);
            renderLevel(ch.id);
          });
        };
        renderLevel(null);
      });
    }

    function renderStageHeader() {
      const ch = state.channels.find(c => c.id === state.activeChannelId);
      if (!ch) return;
      document.getElementById("active-channel-title").innerText = ch.name;
      document.getElementById("active-channel-sub").innerText = ch.type === "voice" ? state.callStatus : ch.desc;
      const actions = document.getElementById("header-actions");
      if (ch.type === "voice") {
        actions.innerHTML = `
          <input id="remote-id-input" type="text" placeholder="ວາງ ID ຄູ່ສາຍ..." />
          ${!state.inCall
            ? `<button type="button" onclick="startCall()">📞 ໂທຫາ</button>`
            : `<button type="button" class="btn-hangup" onclick="hangUp()">📵 ວາງສາຍ</button>`}
        `;
      } else {
        actions.innerHTML = `<span class="badge">${ch.type === "text" ? "Text Channel" : "Forum / Post"}</span>`;
      }
    }

    function renderChatSection(channelId) {
      const list = state.messagesByChannel[channelId] || [];
      const feedHtml = list.map(m => {
        const reacts = Object.entries(m.reactions || {})
          .map(([emoji, count]) => `<button type="button" class="react-btn" onclick="toggleReaction('${m.id}','${emoji}')">${emoji} ${count}</button>`)
          .join("");
        return `
          <div class="msg-item">
            <div class="msg-top">
              <span class="msg-meta"><strong>${escapeHtml(m.sender)}</strong>${escapeHtml(m.time)}</span>
              <button type="button" class="btn-small" onclick="setReplyTo('${m.id}')">ຕອບກັບ</button>
            </div>
            ${m.reply ? `<div class="msg-reply-ref">↳ ${escapeHtml(m.reply.sender)}: ${escapeHtml(m.reply.text)}</div>` : ""}
            <div>${escapeHtml(m.text)}</div>
            <div class="msg-actions">
              ${reacts}
              <button type="button" class="react-btn hover-only" onclick="toggleReaction('${m.id}','👍')">+👍</button>
              <button type="button" class="react-btn hover-only" onclick="toggleReaction('${m.id}','🔥')">+🔥</button>
            </div>
          </div>
        `;
      }).join("");

      return `
        <section id="chat-messages" class="chat-feed">${feedHtml || `<div class="stage-sub">ຍັງບໍ່ມີຂໍ້ຄວາມໃນຫ້ອງນີ້</div>`}</section>
        ${state.replyTo ? `
          <div class="reply-banner">
            <span>ກຳລັງຕອບກັບ <strong>${escapeHtml(state.replyTo.sender)}</strong>: ${escapeHtml(state.replyTo.text)}</span>
            <button type="button" class="btn-small" onclick="clearReply()">✕</button>
          </div>` : ""}
        <form class="chat-input-bar" onsubmit="sendChatMessage(event)">
          <input id="chat-input" type="text" placeholder="ພິມຂໍ້ຄວາມ..." autocomplete="off" />
          <button type="submit">ສົ່ງ</button>
        </form>
      `;
    }

    function renderStageBody() {
      const ch = state.channels.find(c => c.id === state.activeChannelId);
      const body = document.getElementById("stage-body");
      if (!ch) return;

      if (ch.type === "voice") {
        const me = state.users.me;
        const guest = state.users.peer_guest;
        body.innerHTML = `
          <section class="voice-grid">
            <div class="member-card">
              <div class="member-top">
                <strong>${escapeHtml(me.name)} (JP ${me.joinPower})</strong>
                <span class="badge">${state.isMuted ? "Muted" : "Mic On"}</span>
              </div>
              <small class="stage-sub">${escapeHtml(me.email)} • ${state.isDeafened ? "Deafened" : "Audio On"}</small>
            </div>
            <div class="member-card">
              <div class="member-top">
                <strong>${escapeHtml(guest.name)}</strong>
                <button type="button" class="btn-small" onclick="moveGuestToActiveChannel()">Move ຫ້ອງນີ້</button>
              </div>
              <small class="stage-sub">Join Power: ${guest.joinPower}</small>
            </div>
          </section>
          ${renderChatSection(ch.id)}
        `;
      } else if (ch.type === "text") {
        body.innerHTML = renderChatSection(ch.id);
      } else if (ch.type === "post") {
        const allPosts = state.postsByChannel[ch.id] || [];
        const tags = ["All", "ທົ່ວໄປ", "ອັບເດດ", "ຄຳຖາມ", "ຜົນງານ"];
        const filtered = state.activePostTag === "All" ? allPosts : allPosts.filter(p => p.tag === state.activePostTag);

        body.innerHTML = `
          <div class="post-layout">
            <form class="post-composer" onsubmit="createPost(event)">
              <div class="post-composer-row">
                <input id="post-title" type="text" placeholder="ຫົວຂໍ້ໂພສໃໝ່..." required />
                <select id="post-tag">
                  <option value="ທົ່ວໄປ">ທົ່ວໄປ</option>
                  <option value="ອັບເດດ">ອັບເດດ</option>
                  <option value="ຄຳຖາມ">ຄຳຖາມ</option>
                  <option value="ຜົນງານ">ຜົນງານ</option>
                </select>
              </div>
              <textarea id="post-body" rows="3" placeholder="ຂຽນລາຍລະອຽດໂພສ..." required></textarea>
              <div class="post-composer-row">
                <input id="post-img" type="url" placeholder="ລິ້ງຮູບພາບ (ຖ້າມີ)..." />
                <button type="submit">ໂພສໃໝ່</button>
              </div>
            </form>
            <div class="tag-bar">
              ${tags.map(t => `<button type="button" class="tag-pill ${state.activePostTag === t ? "active" : ""}" onclick="setPostTagFilter('${t}')">${t}</button>`).join("")}
            </div>
            ${filtered.map(p => `
              <article class="post-card">
                <div class="post-header">
                  <div>
                    <h3 class="post-title">${escapeHtml(p.title)}</h3>
                    <div class="stage-sub">ໂດຍ ${escapeHtml(p.author)} • ${escapeHtml(p.time)}</div>
                  </div>
                  <span class="badge">${escapeHtml(p.tag)}</span>
                </div>
                <p class="post-body">${escapeHtml(p.body)}</p>
                ${p.imageUrl ? `<img class="post-img" src="${escapeHtml(p.imageUrl)}" alt="post image" />` : ""}
                <div class="post-footer">
                  <button type="button" class="react-btn" onclick="toggleLikePost('${p.id}')">${p.likedByMe ? "❤️" : "🤍"} ${p.likes}</button>
                  <span class="stage-sub">💬 ${p.comments.length} ຄອມເມັ້ນ</span>
                </div>
                <div class="comment-box">
                  ${p.comments.map(c => `<div class="comment-item"><strong>${escapeHtml(c.author)}:</strong> ${escapeHtml(c.text)}</div>`).join("")}
                  <form class="comment-form" onsubmit="addComment(event, '${p.id}')">
                    <input type="text" placeholder="ຂຽນຄອມເມັ້ນ..." autocomplete="off" />
                    <button type="submit" class="btn-small">ສົ່ງ</button>
                  </form>
                </div>
              </article>
            `).join("") || `<div class="stage-sub">ຍັງບໍ່ມີໂພສໃນໝວດນີ້</div>`}
          </div>
        `;
      }

      const feed = document.getElementById("chat-messages");
      if (feed) feed.scrollTop = feed.scrollHeight;
    }

    function renderAll() {
      renderChannelTree();
      renderStageHeader();
      renderStageBody();
    }

    function bootWorkspace() {
      const session = getSession();
      if (!session) {
        document.getElementById("auth-gate").classList.remove("hidden");
        document.getElementById("app-workspace").classList.add("hidden");
        return;
      }

      state.users.me.name = session.displayName;
      state.users.me.email = session.email;
      state.users.me.joinPower = session.joinPower ?? 50;
      state.users.me.movePower = session.movePower ?? 50;

      document.getElementById("sidebar-user-name").innerText = session.displayName;
      document.getElementById("sidebar-user-email").innerText = session.email;
      document.getElementById("auth-gate").classList.add("hidden");
      document.getElementById("app-workspace").classList.remove("hidden");

      initPeer();
      renderAll();
    }

    bootWorkspace();
  </script>
</body>
</html>
