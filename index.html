  </div>

  <div id="toast" class="toast hidden"></div>
  <audio id="remote-audio" autoplay playsinline></audio>

  <script>
    /* ================= STORAGE KEYS & CONSTANTS ================= */
    const FONT_KEY = "mdc_font_preset_v1";
    const DOMAIN = "@mdc.http";
    const PEER_PREFIX = "mdchub-v1-";
    const USERS_KEY = "mdc_users_v1";
    const SESSION_KEY = "mdc_current_session_v1";
    const AUTH_LOGS_KEY = "mdc_auth_logs_v1";
    const FRIENDS_KEY = "mdc_friends_v1";
    const CHANNELS_KEY = "mdc_channels_v1";
    const MESSAGES_KEY = "mdc_messages_v2";
    const POSTS_KEY = "mdc_posts_v2";

    /* ================= FONT SELECTOR ================= */
    const FONT_PRESETS = {
      eng_somvang: "'Inter', 'Lao Somvang', 'Noto Sans Lao', system-ui, sans-serif",
      somvang_only: "'Lao Somvang', 'Noto Sans Lao', sans-serif",
      noto_lao: "'Inter', 'Noto Sans Lao', system-ui, sans-serif"
    };

    function applyFontPreset(presetKey) {
      document.documentElement.style.setProperty("--app-font", FONT_PRESETS[presetKey] || FONT_PRESETS.eng_somvang);
      localStorage.setItem(FONT_KEY, presetKey);
      const sel = document.getElementById("font-selector");
      if (sel) sel.value = presetKey;
    }
    applyFontPreset(localStorage.getItem(FONT_KEY) || "eng_somvang");

    /* ================= HELPERS & HANDLE <-> PEER ID ================= */
    function escapeHtml(str) {
      return String(str ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }
    function nowTime() {
      return new Date().toLocaleTimeString("lo-LA", { hour: "2-digit", minute: "2-digit" });
    }
    function initials(name) {
      return (name || "?").trim().slice(0, 2).toUpperCase();
    }

    let toastTimer = null;
    function showToast(msg) {
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.classList.remove("hidden");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.add("hidden"), 2600);
    }

    function handleToPeerId(raw) {
      const clean = (raw || "").trim().toLowerCase();
      if (!clean) return "";
      if (/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(clean)) return clean;
      if (clean.startsWith(PEER_PREFIX)) return clean;
      const handle = clean.endsWith(DOMAIN) ? clean.slice(0, -DOMAIN.length) : clean;
      if (!/^[a-z0-9._-]{3,40}$/.test(handle)) return "";
      return PEER_PREFIX + handle.replace(/\./g, "_dot_");
    }
    function peerIdToHandle(peerId) {
      if (!peerId) return "";
      if (peerId.startsWith(PEER_PREFIX)) return peerId.slice(PEER_PREFIX.length).replace(/_dot_/g, ".") + DOMAIN;
      return peerId;
    }
    function peerIdToShortHandle(peerId) {
      if (!peerId) return "";
      if (peerId.startsWith(PEER_PREFIX)) return peerId.slice(PEER_PREFIX.length).replace(/_dot_/g, ".");
      return peerId;
    }

    /* ================= AUTH & LOGS ================= */
    function normalizeMdcEmail(raw) {
      let clean = raw.trim().toLowerCase();
      if (clean.endsWith(DOMAIN)) clean = clean.slice(0, -DOMAIN.length);
      return { valid: /^[a-z0-9._-]{3,32}$/.test(clean), handle: clean, email: clean ? clean + DOMAIN : "" };
    }
    function updateEmailPreview() {
      const val = document.getElementById("reg-handle").value;
      const preview = document.getElementById("reg-preview");
      if (!val.trim()) { preview.textContent = "ຕົວຢ່າງ: santoi@mdc.http"; preview.style.color = "var(--text-muted)"; return; }
      const res = normalizeMdcEmail(val);
      preview.textContent = res.valid ? "✓ ໃຊ້ໄດ້: " + res.email : "✕ ໃຊ້ໄດ້ສະເພາະ a-z, 0-9, . _ - (3–32 ຕົວ)";
      preview.style.color = res.valid ? "var(--accent)" : "var(--warning)";
    }
    async function hashPassword(password) {
      const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(password));
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
    }
    function getStoredUsers() { try { return JSON.parse(localStorage.getItem(USERS_KEY) || "[]"); } catch { return []; } }
    function getSession() {
      const raw = localStorage.getItem(SESSION_KEY) || sessionStorage.getItem(SESSION_KEY);
      try { return raw ? JSON.parse(raw) : null; } catch { return null; }
    }
    function setSession(user, remember) {
      const payload = JSON.stringify({ id: user.id, displayName: user.displayName, email: user.email, role: user.role, joinPower: user.joinPower, movePower: user.movePower });
      if (remember) localStorage.setItem(SESSION_KEY, payload);
      else sessionStorage.setItem(SESSION_KEY, payload);
    }
    function showAuthAlert(msg, type = "error") {
      const box = document.getElementById("auth-alert");
      box.textContent = msg;
      box.className = `alert show ${type}`;
    }
    function switchAuthTab(mode) {
      document.getElementById("auth-alert").className = "alert";
      const isLogin = mode === "login";
      document.getElementById("tab-login").classList.toggle("active", isLogin);
      document.getElementById("tab-register").classList.toggle("active", !isLogin);
      document.getElementById("form-login").classList.toggle("hidden", !isLogin);
      document.getElementById("form-register").classList.toggle("hidden", isLogin);
    }
    function getAuthLogs() { try { return JSON.parse(localStorage.getItem(AUTH_LOGS_KEY) || "[]"); } catch { return []; } }
    function recordAuthEvent(action, user) {
      const logs = getAuthLogs();
      logs.unshift({
        id: "log_" + Date.now(), action,
        displayName: user?.displayName || "Unknown",
        email: user?.email || "-",
        time: new Date().toLocaleString("lo-LA", { year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", second: "2-digit" })
      });
      localStorage.setItem(AUTH_LOGS_KEY, JSON.stringify(logs.slice(0, 50)));
    }
    function openAuthLogModal() {
      const container = document.getElementById("auth-log-list");
      const logs = getAuthLogs();
      container.innerHTML = logs.length ? logs.map(i => `
        <div class="log-row">
          <div><strong>${escapeHtml(i.displayName)}</strong><div class="user-email-mini">${escapeHtml(i.email)}</div><div class="stage-sub">${escapeHtml(i.time)}</div></div>
          <span class="log-tag ${escapeHtml(i.action)}">${escapeHtml(i.action)}</span>
        </div>`).join("") : `<div class="stage-sub">ຍັງບໍ່ມີປະຫວັດການເຂົ້າ-ອອກລະບົບ</div>`;
      document.getElementById("auth-log-modal").classList.remove("hidden");
    }
    function closeAuthLogModal() { document.getElementById("auth-log-modal").classList.add("hidden"); }
    function clearAuthLogs() { localStorage.removeItem(AUTH_LOGS_KEY); openAuthLogModal(); }

    async function handleRegister(event) {
      event.preventDefault();
      const displayName = document.getElementById("reg-display").value.trim();
      const parsed = normalizeMdcEmail(document.getElementById("reg-handle").value);
      const password = document.getElementById("reg-password").value;
      const confirm = document.getElementById("reg-confirm").value;
      if (!parsed.valid) return showAuthAlert("ຊື່ອີເມວບໍ່ຖືກຕ້ອງ (ໃຊ້ a-z, 0-9, . _ - 3–32 ຕົວ)");
      if (password !== confirm) return showAuthAlert("ລະຫັດຜ່ານ ແລະ ການຢືນຢັນບໍ່ກົງກັນ");
      const users = getStoredUsers();
      if (users.some(u => u.email === parsed.email)) return showAuthAlert(`ອີເມວ ${parsed.email} ມີຜູ້ໃຊ້ແລ້ວ`);
      const newUser = { id: "u_" + Date.now(), displayName, email: parsed.email, passwordHash: await hashPassword(password), role: "Member", joinPower: 50, movePower: 50 };
      users.push(newUser);
      localStorage.setItem(USERS_KEY, JSON.stringify(users));
      setSession(newUser, true);
      recordAuthEvent("REGISTER", newUser);
      recordAuthEvent("LOGIN", newUser);
      bootWorkspace();
    }

    async function handleLogin(event) {
      event.preventDefault();
      const parsed = normalizeMdcEmail(document.getElementById("login-handle").value);
      const password = document.getElementById("login-password").value;
      const remember = document.getElementById("remember-me").checked;
      if (!parsed.valid) return showAuthAlert("ຮູບແບບອີເມວ @mdc.http ບໍ່ຖືກຕ້ອງ");
      const user = getStoredUsers().find(u => u.email === parsed.email);
      if (!user) return showAuthAlert(`ບໍ່ພົບບັນຊີ ${parsed.email}`);
      if (user.passwordHash !== await hashPassword(password)) return showAuthAlert("ລະຫັດຜ່ານບໍ່ຖືກຕ້ອງ");
      setSession(user, remember);
      recordAuthEvent("LOGIN", user);
      bootWorkspace();
    }

    function handleLogout() {
      const current = getSession();
      if (current) recordAuthEvent("LOGOUT", current);
      localStorage.removeItem(SESSION_KEY);
      sessionStorage.removeItem(SESSION_KEY);
      leaveVoiceChannel();
      if (dataConn) { dataConn.close(); dataConn = null; }
      if (peer) { peer.destroy(); peer = null; }
      state.myPeerId = "";
      state.syncedPeerId = "";
      state.syncedPeerName = "";
      document.getElementById("login-password").value = "";
      closeAuthLogModal();
      document.getElementById("app-workspace").classList.add("hidden");
      document.getElementById("auth-gate").classList.remove("hidden");
      showAuthAlert("ອອກຈາກລະບົບ ແລະ ບັນທຶກປະຫວັດ Logout ແລ້ວ", "success");
    }

    /* ================= DEFAULT DATA & PERSISTENCE ================= */
    const DEFAULT_CHANNELS = [
      { id: "ch_text_general", type: "text", parentId: null, name: "ແຊັດທົ່ວໄປ", desc: "ສົນທະນາທົ່ວໄປໃນທີມ", neededJoinPower: 0 },
      { id: "ch_text_dev", type: "text", parentId: null, name: "dev-chat", desc: "ແລກປ່ຽນໂຄ້ດ ແລະ ແຈ້ງບັກ", neededJoinPower: 0 },
      { id: "ch_post_news", type: "post", parentId: null, name: "ປະກາດ-ໂພສ", desc: "ໂພສຂ່າວສານ, ອັບເດດ ແລະ ຄອມເມັ້ນ", neededJoinPower: 0 },
      { id: "ch_voice_general", type: "voice", parentId: null, name: "General Voice", desc: "ຫ້ອງໂທສຽງ & ວິດີໂອຫຼັກ", neededJoinPower: 0 },
      { id: "ch_voice_squad1", type: "voice", parentId: null, name: "Squad 1", desc: "ຫ້ອງທີມ (Join Power 10)", neededJoinPower: 10 },
      { id: "ch_voice_sub_a", type: "voice", parentId: "ch_voice_squad1", name: "Sub-channel A", desc: "ຫ້ອງຍ່ອຍຍຸດທະວິທີ (Join Power 25)", neededJoinPower: 25 }
    ];

    const DEFAULT_MESSAGES = {
      ch_text_general: [{ id: "m_welcome_1", sender: "System", senderEmail: "", time: "09:00", text: "ຍິນດີຕ້ອນຮັບສູ່ຫ້ອງ ແຊັດທົ່ວໄປ — ໂທ ຫຼື ເຊື່ອມຕໍ່ໝູ່ເພື່ອຊິ້ງຂໍ້ຄວາມແບບ Real-time", reply: null, reactions: { "👍": 1 }, edited: false }],
      ch_voice_general: [{ id: "m_welcome_2", sender: "System", senderEmail: "", time: "09:00", text: "ພິມຊື່ @mdc.http ຂອງໝູ່ ຫຼື ກົດ 🔗 ລິ້ງເຊີນ ເພື່ອໂທສຽງ/ເປີດກ້ອງ ແລະ ຊິ້ງແຊັດ", reply: null, reactions: {}, edited: false }]
    };

    const DEFAULT_POSTS = {
      ch_post_news: [{
        id: "p_v06_welcome", author: "System", authorEmail: "", time: "ມື້ນີ້", tag: "ອັບເດດ",
        title: "ອັບເດດ v0.6 — ຊິ້ງແຊັດ/ໂພສ P2P + ເປີດກ້ອງ + ແກ້ໄຂ/ລົບໄດ້",
        body: "ຕອນນີ້ສາມາດເປີດກ້ອງລະຫວ່າງໂທ, ແກ້ໄຂ-ລົບຂໍ້ຄວາມແຊັດ ແລະ ໂພສ, ແລະ ຊິ້ງໃຫ້ໝູ່ເຫັນແບບ Real-time ຜ່ານ PeerJS DataChannel ໄດ້ແລ້ວ.",
        imageUrl: "", likes: 1, likedByMe: false, edited: false, comments: []
      }]
    };

    function loadJson(key, fallback) {
      try {
        const raw = localStorage.getItem(key);
        if (!raw) return structuredClone(fallback);
        const parsed = JSON.parse(raw);
        return parsed ?? structuredClone(fallback);
      } catch { return structuredClone(fallback); }
    }

    function saveChannels() { localStorage.setItem(CHANNELS_KEY, JSON.stringify(state.channels)); }
    function saveFriends() { localStorage.setItem(FRIENDS_KEY, JSON.stringify(state.friends)); }
    function saveMessages() { localStorage.setItem(MESSAGES_KEY, JSON.stringify(state.messagesByChannel)); }
    function savePosts() { localStorage.setItem(POSTS_KEY, JSON.stringify(state.postsByChannel)); }

    const initialCallParam = new URLSearchParams(window.location.search).get("call");

    const state = {
      viewMode: "channel",
      friendTab: "all",
      activeChannelId: "ch_voice_general",
      connectedVoiceChannelId: null,
      voiceChatOpen: true,
      replyTo: null,
      editingMessageId: null,
      editingPostId: null,
      activePostTag: "All",
      isMuted: false,
      isDeafened: false,
      isPTT: false,
      pttPressed: false,
      isCameraOn: false,
      isRemoteCameraOn: false,
      isLocalSpeaking: false,
      isRemoteSpeaking: false,
      callStatus: "ກຳລັງຈອງຊື່ໂທ...",
      inCall: false,
      myPeerId: "",
      remotePeerId: null,
      remoteDisplayName: "",
      syncedPeerId: "",
      syncedPeerName: "",
      pendingInvite: initialCallParam ? initialCallParam.trim() : "",
      channels: loadJson(CHANNELS_KEY, DEFAULT_CHANNELS),
      friends: loadJson(FRIENDS_KEY, []),
      users: {
        me: { id: "me", name: "You", email: "", joinPower: 50, movePower: 50, neededMovePower: 50 }
      },
      messagesByChannel: loadJson(MESSAGES_KEY, DEFAULT_MESSAGES),
      postsByChannel: loadJson(POSTS_KEY, DEFAULT_POSTS)
    };

    /* ================= INVITE LINK & COPY ================= */
    function copyMyHandle() {
      const handle = peerIdToHandle(state.myPeerId) || state.users.me.email;
      navigator.clipboard.writeText(handle);
      showToast("📋 ກັອບປີ້ຊື່ໂທແລ້ວ: " + handle);
    }

    function copyInviteLink() {
      const shortHandle = peerIdToShortHandle(state.myPeerId);
      if (!shortHandle) return showToast("ລໍຖ້າເຊື່ອມຕໍ່ຊື່ໂທຈັກຄາວ...");
      const base = window.location.origin + window.location.pathname;
      const url = `${base}?call=${encodeURIComponent(shortHandle)}`;
      navigator.clipboard.writeText(url);
      showToast("🔗 ກັອບລິ້ງເຊີນແລ້ວ — ສົ່ງໃຫ້ໝູ່ກົດໂທໄດ້ເລີຍ!");
    }

    function renderInviteBanner() {
      const banner = document.getElementById("invite-banner");
      const label = document.getElementById("invite-caller-label");
      if (!banner || !label) return;
      if (state.pendingInvite && handleToPeerId(state.pendingInvite) !== state.myPeerId) {
        const display = state.pendingInvite.includes("@") ? state.pendingInvite : state.pendingInvite + DOMAIN;
        label.textContent = display;
        banner.classList.remove("hidden");
      } else {
        banner.classList.add("hidden");
      }
    }

    function acceptInviteCall() {
      const target = state.pendingInvite;
      dismissInvite();
      if (!target) return;
      callFriendByHandle(target);
    }

    function dismissInvite() {
      state.pendingInvite = "";
      renderInviteBanner();
      if (window.location.search.includes("call=")) {
        window.history.replaceState({}, "", window.location.pathname);
      }
    }

    /* ================= FRIENDS LOGIC ================= */
    function openFriendsView() { state.viewMode = "friends"; renderAll(); }
    function setFriendTab(tab) { state.friendTab = tab; renderStageBody(); }

    function addFriend(event) {
      event.preventDefault();
      const name = document.getElementById("friend-name-input").value.trim();
      const rawHandle = document.getElementById("friend-handle-input").value.trim();
      const peerId = handleToPeerId(rawHandle);
      if (!name || !peerId) return alert("ກະລຸນາໃສ່ຊື່ໝູ່ ແລະ ຊື່ໂທ (ເຊັ່ນ leo ຫຼື leo@mdc.http)");
      if (state.friends.some(f => f.peerId === peerId)) return alert("ໝູ່ຄົນນີ້ມີໃນລາຍຊື່ແລ້ວ");

      state.friends.unshift({
        id: "fr_" + Date.now(), name, peerId, email: peerIdToHandle(peerId), blocked: false, addedAt: nowTime()
      });
      saveFriends();
      showToast("✓ ເພີ່ມໝູ່ " + name + " ແລ້ວ");
      renderAll();
    }

    function quickAddCurrentRemoteFriend() {
      const rawTarget = state.remotePeerId || state.syncedPeerId || (document.getElementById("remote-id-input")?.value.trim() || "");
      const targetPeerId = handleToPeerId(rawTarget);
      if (!targetPeerId) return alert("ກະລຸນາພິມຊື່ໂທຂອງໝູ່ກ່ອນ (ເຊັ່ນ leo@mdc.http)");
      if (state.friends.some(f => f.peerId === targetPeerId)) return showToast("ໝູ່ຄົນນີ້ຢູ່ໃນລາຍຊື່ແລ້ວ");
      const defaultName = state.remoteDisplayName || state.syncedPeerName || peerIdToShortHandle(targetPeerId);
      const name = prompt("ຕັ້ງຊື່ໃຫ້ໝູ່ຄົນນີ້:", defaultName);
      if (!name || !name.trim()) return;
      state.friends.unshift({
        id: "fr_" + Date.now(), name: name.trim(), peerId: targetPeerId, email: peerIdToHandle(targetPeerId), blocked: false, addedAt: nowTime()
      });
      saveFriends();
      showToast("✓ ບັນທຶກ " + name.trim() + " ເປັນໝູ່ແລ້ວ");
      renderAll();
    }

    function removeFriend(friendId) {
      const f = state.friends.find(x => x.id === friendId);
      if (!f) return;
      if (!confirm(`ຕ້ອງການລົບ "${f.name}" ອອກຈາກລາຍຊື່ໝູ່ແທ້ບໍ່?`)) return;
      state.friends = state.friends.filter(x => x.id !== friendId);
      saveFriends();
      renderAll();
    }

    function toggleBlockFriend(friendId) {
      const f = state.friends.find(x => x.id === friendId);
      if (!f) return;
      f.blocked = !f.blocked;
      saveFriends();
      if (f.blocked) {
        if (state.inCall && state.remotePeerId === f.peerId) hangUp();
        if (dataConn && dataConn.peer === f.peerId) { dataConn.close(); dataConn = null; }
      }
      renderAll();
    }

    function isPeerBlocked(peerId) { return state.friends.some(f => f.peerId === peerId && f.blocked); }
    function getFriendNameByPeer(peerId) {
      const f = state.friends.find(x => x.peerId === peerId);
      if (f) return f.name;
      if (state.remotePeerId === peerId && state.remoteDisplayName) return state.remoteDisplayName;
      if (state.syncedPeerId === peerId && state.syncedPeerName) return state.syncedPeerName;
      return peerIdToShortHandle(peerId) || "Remote";
    }

    function callFriendByHandle(rawHandleOrPeerId) {
      const peerId = handleToPeerId(rawHandleOrPeerId);
      if (!peerId) return alert("ຊື່ໂທບໍ່ຖືກຕ້ອງ");
      if (isPeerBlocked(peerId)) return alert("ໝູ່ຄົນນີ້ຖືກ Block ຢູ່ — ກະລຸນາປົດ Block ກ່ອນໂທ");
      const voiceCh = state.channels.find(c => c.id === state.connectedVoiceChannelId && c.type === "voice")
        || state.channels.find(c => c.type === "voice");
      if (voiceCh) {
        state.viewMode = "channel";
        state.activeChannelId = voiceCh.id;
        state.connectedVoiceChannelId = voiceCh.id;
        renderAll();
      }
      startCall(rawHandleOrPeerId);
    }

    /* ================= PEERJS DATA SYNC (CHAT & POSTS REAL-TIME) ================= */
    let peer = null;
    let dataConn = null;
    let localAudioStream = null;
    let cameraStream = null;
    let localCombinedStream = null;
    let remoteMediaStream = null;
    let currentCall = null;
    let audioCtx = null;
    let idRetryCount = 0;

    function sendData(payload) {
      if (dataConn && dataConn.open) {
        try { dataConn.send(payload); } catch (e) { console.warn("Data send error:", e); }
      }
    }

    function connectDataChannel(targetPeerId) {
      if (!peer || !targetPeerId || targetPeerId === state.myPeerId) return;
      if (dataConn && dataConn.open && dataConn.peer === targetPeerId) return;
      if (dataConn) { try { dataConn.close(); } catch {} }
      const conn = peer.connect(targetPeerId, {
        reliable: true,
        metadata: { name: state.users.me.name, email: state.users.me.email }
      });
      setupDataConnection(conn);
    }

    function setupDataConnection(conn) {
      if (isPeerBlocked(conn.peer)) { conn.close(); return; }
      dataConn = conn;

      conn.on("open", () => {
        state.syncedPeerId = conn.peer;
        state.syncedPeerName = conn.metadata?.name || getFriendNameByPeer(conn.peer);
        showToast("🟢 ຊິ້ງແຊັດ & ໂພສກັບ " + state.syncedPeerName + " ແລ້ວ");
        sendData({
          type: "hello_sync",
          name: state.users.me.name,
          email: state.users.me.email,
          cameraOn: state.isCameraOn,
          messagesByChannel: state.messagesByChannel,
          postsByChannel: state.postsByChannel
        });
        renderStageHeader();
      });

      conn.on("data", handleIncomingData);

      conn.on("close", () => {
        if (dataConn === conn) {
          dataConn = null;
          state.syncedPeerId = "";
          state.syncedPeerName = "";
          state.isRemoteCameraOn = false;
          renderStageHeader();
        }
      });
    }

    function mergeById(localArr, remoteArr, prepend = false) {
      const map = new Map();
      (localArr || []).forEach(item => map.set(item.id, item));
      (remoteArr || []).forEach(item => {
        if (!map.has(item.id)) map.set(item.id, item);
      });
      const merged = Array.from(map.values());
      return prepend ? merged : merged;
    }

    function handleIncomingData(data) {
      if (!data || !data.type) return;

      if (data.type === "hello_sync") {
        if (data.name) {
          state.syncedPeerName = data.name;
          if (state.remotePeerId === state.syncedPeerId) state.remoteDisplayName = data.name;
        }
        state.isRemoteCameraOn = !!data.cameraOn;
        if (data.messagesByChannel) {
          Object.entries(data.messagesByChannel).forEach(([chId, list]) => {
            state.messagesByChannel[chId] = mergeById(state.messagesByChannel[chId], list);
          });
          saveMessages();
        }
        if (data.postsByChannel) {
          Object.entries(data.postsByChannel).forEach(([chId, list]) => {
            state.postsByChannel[chId] = mergeById(state.postsByChannel[chId], list);
          });
          savePosts();
        }
        renderAll();
        return;
      }

      if (data.type === "video_state") {
        state.isRemoteCameraOn = !!data.active;
        renderStageBody();
        return;
      }

      if (data.type === "chat_new") {
        const list = state.messagesByChannel[data.channelId] || [];
        if (!list.some(m => m.id === data.message.id)) {
          list.push(data.message);
          state.messagesByChannel[data.channelId] = list;
          saveMessages();
          renderStageBody();
        }
        return;
      }

      if (data.type === "chat_edit") {
        const list = state.messagesByChannel[data.channelId] || [];
        const msg = list.find(m => m.id === data.msgId);
        if (msg) {
          msg.text = data.text;
          msg.edited = true;
          saveMessages();
          renderStageBody();
        }
        return;
      }

      if (data.type === "chat_delete") {
        const list = state.messagesByChannel[data.channelId] || [];
        state.messagesByChannel[data.channelId] = list.filter(m => m.id !== data.msgId);
        saveMessages();
        renderStageBody();
        return;
      }

      if (data.type === "chat_react") {
        const msg = (state.messagesByChannel[data.channelId] || []).find(m => m.id === data.msgId);
        if (msg) {
          msg.reactions[data.emoji] = (msg.reactions[data.emoji] || 0) + 1;
          saveMessages();
          renderStageBody();
        }
        return;
      }

      if (data.type === "post_new") {
        const list = state.postsByChannel[data.channelId] || [];
        if (!list.some(p => p.id === data.post.id)) {
          list.unshift(data.post);
          state.postsByChannel[data.channelId] = list;
          savePosts();
          renderStageBody();
        }
        return;
      }

      if (data.type === "post_edit") {
        const post = (state.postsByChannel[data.channelId] || []).find(p => p.id === data.postId);
        if (post) {
          post.title = data.title;
          post.body = data.body;
          post.tag = data.tag;
          post.imageUrl = data.imageUrl;
          post.edited = true;
          savePosts();
          renderStageBody();
        }
        return;
      }

      if (data.type === "post_delete") {
        const list = state.postsByChannel[data.channelId] || [];
        state.postsByChannel[data.channelId] = list.filter(p => p.id !== data.postId);
        savePosts();
        renderStageBody();
        return;
      }

      if (data.type === "post_like") {
        const post = (state.postsByChannel[data.channelId] || []).find(p => p.id === data.postId);
        if (post) {
          post.likes = Math.max(0, (post.likes || 0) + data.delta);
          savePosts();
          renderStageBody();
        }
        return;
      }

      if (data.type === "post_comment") {
        const post = (state.postsByChannel[data.channelId] || []).find(p => p.id === data.postId);
        if (post) {
          post.comments.push(data.comment);
          savePosts();
          renderStageBody();
        }
        return;
      }
    }

    /* ================= CAMERA & WEBRTC STREAM HELPERS ================= */
    function createDummyVideoTrack() {
      try {
        const canvas = document.createElement("canvas");
        canvas.width = 2;
        canvas.height = 2;
        const ctx = canvas.getContext("2d");
        ctx.fillStyle = "#000";
        ctx.fillRect(0, 0, 2, 2);
        const track = canvas.captureStream(1).getVideoTracks()[0];
        if (track) track.enabled = false;
        return track;
      } catch {
        return null;
      }
    }

    async function buildLocalCallStream() {
      localAudioStream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
      });
      const tracks = [...localAudioStream.getAudioTracks()];
      if (state.isCameraOn && cameraStream && cameraStream.getVideoTracks()[0]) {
        tracks.push(cameraStream.getVideoTracks()[0]);
      } else {
        const dummy = createDummyVideoTrack();
        if (dummy) tracks.push(dummy);
      }
      localCombinedStream = new MediaStream(tracks);
      applyAudioTrackStates();
      startSpeakingMonitor(localAudioStream, true);
      return localCombinedStream;
    }

    async function toggleCamera() {
      if (!state.isCameraOn) {
        try {
          cameraStream = await navigator.mediaDevices.getUserMedia({
            video: { width: { ideal: 640 }, height: { ideal: 360 } }
          });
          const camTrack = cameraStream.getVideoTracks()[0];
          state.isCameraOn = true;

          if (currentCall && currentCall.peerConnection) {
            const videoSender = currentCall.peerConnection.getSenders().find(s => s.track && s.track.kind === "video");
            if (videoSender) {
              await videoSender.replaceTrack(camTrack);
            }
          }
          sendData({ type: "video_state", active: true });
          renderStageBody();
        } catch (err) {
          alert("ບໍ່ສາມາດເປີດກ້ອງໄດ້: " + err.message);
        }
      } else {
        if (cameraStream) {
          cameraStream.getTracks().forEach(t => t.stop());
          cameraStream = null;
        }
        state.isCameraOn = false;

        if (currentCall && currentCall.peerConnection) {
          const videoSender = currentCall.peerConnection.getSenders().find(s => s.track && s.track.kind === "video");
          const dummy = createDummyVideoTrack();
          if (videoSender && dummy) {
            await videoSender.replaceTrack(dummy);
          }
        }
        sendData({ type: "video_state", active: false });
        renderStageBody();
      }
    }

    function attachMediaStreamsToUI() {
      const localVid = document.getElementById("local-video");
      if (localVid && state.isCameraOn && cameraStream) {
        if (localVid.srcObject !== cameraStream) localVid.srcObject = cameraStream;
        localVid.play().catch(() => {});
      }
      const remoteVid = document.getElementById("remote-video");
      if (remoteVid && state.isRemoteCameraOn && remoteMediaStream) {
        if (remoteVid.srcObject !== remoteMediaStream) remoteVid.srcObject = remoteMediaStream;
        remoteVid.play().catch(() => {});
      }
    }

    function startSpeakingMonitor(stream, isLocal) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === "suspended") audioCtx.resume();
        const source = audioCtx.createMediaStreamSource(stream);
        const analyser = audioCtx.createAnalyser();
        analyser.fftSize = 256;
        source.connect(analyser);
        const data = new Uint8Array(analyser.frequencyBinCount);

        const interval = setInterval(() => {
          if (!stream.active) { clearInterval(interval); return; }
          analyser.getByteFrequencyData(data);
          const avg = data.reduce((a, b) => a + b, 0) / data.length;
          const speaking = avg > 18 && (isLocal ? !state.isMuted : !state.isDeafened);
          const prev = isLocal ? state.isLocalSpeaking : state.isRemoteSpeaking;
          if (speaking !== prev) {
            if (isLocal) state.isLocalSpeaking = speaking;
            else state.isRemoteSpeaking = speaking;
            updateSpeakingClasses();
          }
        }, 120);
        return interval;
      } catch { return null; }
    }

    function updateSpeakingClasses() {
      const localTile = document.getElementById("tile-local");
      if (localTile) localTile.classList.toggle("speaking", state.isLocalSpeaking);
      const remoteTile = document.getElementById("tile-remote");
      if (remoteTile) remoteTile.classList.toggle("speaking", state.isRemoteSpeaking);
      const localMini = document.getElementById("mini-avatar-local");
      if (localMini) localMini.classList.toggle("speaking", state.isLocalSpeaking);
    }

    function initPeer(customIdOverride = null) {
      if (peer && !peer.destroyed) peer.destroy();
      const desiredId = customIdOverride || handleToPeerId(state.users.me.email);

      peer = new Peer(desiredId || undefined, {
        config: {
          iceServers: [
            { urls: "stun:stun.l.google.com:19302" },
            { urls: "stun:stun1.l.google.com:19302" }
          ]
        }
      });

      peer.on("open", id => {
        idRetryCount = 0;
        state.myPeerId = id;
        document.getElementById("my-call-handle").innerText = peerIdToHandle(id);
        state.callStatus = "🟢 ພ້ອມໂທສຽງ/ວິດີໂອ (ຊື່ໂທ: " + peerIdToShortHandle(id) + ")";
        renderStageHeader();
        renderInviteBanner();
      });

      peer.on("connection", conn => setupDataConnection(conn));

      peer.on("disconnected", () => {
        state.callStatus = "⚠️ ສັນຍານຫຼຸດ — ກຳລັງເຊື່ອມຕໍ່ໃໝ່...";
        renderStageHeader();
        setTimeout(() => { if (peer && !peer.destroyed) peer.reconnect(); }, 2000);
      });

      peer.on("error", err => {
        if (err.type === "unavailable-id") {
          idRetryCount++;
          if (idRetryCount <= 2) {
            state.callStatus = "⏳ ກຳລັງຈອງຊື່ໂທຄືນ...";
            renderStageHeader();
            setTimeout(() => initPeer(desiredId), 2200);
          } else {
            initPeer(desiredId + "-" + Math.floor(100 + Math.random() * 900));
          }
          return;
        }
        if (err.type === "peer-unavailable") {
          state.callStatus = "✕ ບໍ່ພົບຄູ່ສາຍ (ໝູ່ອາດຍັງບໍ່ໄດ້ເປີດໜ້າເວັບ)";
          resetCallUI(false);
          return;
        }
        state.callStatus = "Error: " + err.type;
        renderStageHeader();
      });

      peer.on("call", async call => {
        if (isPeerBlocked(call.peer)) {
          call.close();
          state.callStatus = "🚫 ບລັອກສາຍເຂົ້າຈາກ " + getFriendNameByPeer(call.peer);
          renderStageHeader();
          return;
        }
        try {
          state.remotePeerId = call.peer;
          state.remoteDisplayName = call.metadata?.name || peerIdToShortHandle(call.peer);
          state.callStatus = "ກຳລັງຮັບສາຍຈາກ " + getFriendNameByPeer(call.peer) + "...";
          if (!state.connectedVoiceChannelId) {
            const firstVoice = state.channels.find(c => c.type === "voice");
            if (firstVoice) state.connectedVoiceChannelId = firstVoice.id;
          }
          renderStageHeader();
          const stream = await buildLocalCallStream();
          call.answer(stream);
          setupCallEvents(call);
          connectDataChannel(call.peer);
        } catch (err) {
          alert("ບໍ່ສາມາດເປີດໄມໂຄຣໂຟນໄດ້: " + err.message);
        }
      });
    }

    window.addEventListener("beforeunload", () => {
      if (peer && !peer.destroyed) peer.destroy();
    });

    async function startCall(explicitTarget = null) {
      const input = document.getElementById("remote-id-input");
      const rawTarget = (explicitTarget || (input ? input.value.trim() : "")).trim();
      if (!rawTarget) return alert("ກະລຸນາພິມຊື່ໝູ່ (ເຊັ່ນ leo ຫຼື leo@mdc.http)");

      const targetPeerId = handleToPeerId(rawTarget);
      if (!targetPeerId) return alert("ຮູບແບບຊື່ໂທບໍ່ຖືກຕ້ອງ (ໃຊ້ a-z, 0-9, . _ -)");
      if (targetPeerId === state.myPeerId) return alert("ບໍ່ສາມາດໂທຫາຊື່ຂອງຕົວເອງໄດ້");
      if (isPeerBlocked(targetPeerId)) return alert("ໝູ່ຄົນນີ້ຖືກ Block ຢູ່");

      const activeCh = state.channels.find(c => c.id === state.activeChannelId);
      if (activeCh && activeCh.type === "voice") state.connectedVoiceChannelId = activeCh.id;

      try {
        state.remotePeerId = targetPeerId;
        state.remoteDisplayName = getFriendNameByPeer(targetPeerId);
        state.callStatus = "ກຳລັງໂທຫາ " + state.remoteDisplayName + "...";
        renderStageHeader();

        connectDataChannel(targetPeerId);
        const stream = await buildLocalCallStream();
        const call = peer.call(targetPeerId, stream, {
          metadata: { name: state.users.me.name, email: state.users.me.email }
        });
        setupCallEvents(call);
      } catch (err) {
        alert("ບໍ່ສາມາດເປີດໄມໂຄຣໂຟນໄດ້: " + err.message);
      }
    }

    function setupCallEvents(call) {
      currentCall = call;
      state.inCall = true;
      state.remotePeerId = call.peer;
      renderAll();

      call.on("stream", remoteStream => {
        remoteMediaStream = remoteStream;
        const audioEl = document.getElementById("remote-audio");
        audioEl.srcObject = remoteStream;
        audioEl.muted = state.isDeafened;
        audioEl.volume = 1.0;
        audioEl.play().catch(err => console.warn("Audio autoplay blocked:", err));

        startSpeakingMonitor(remoteStream, false);
        state.callStatus = "🟢 ກຳລັງໂທກັບ " + getFriendNameByPeer(call.peer);
        renderAll();
      });

      call.on("close", () => resetCallUI(true));
    }

    function hangUp() {
      if (currentCall) currentCall.close();
      resetCallUI(true);
    }

    function resetCallUI(resetStatus = true) {
      if (localAudioStream) localAudioStream.getTracks().forEach(t => t.stop());
      localAudioStream = null;
      localCombinedStream = null;
      remoteMediaStream = null;
      currentCall = null;
      state.inCall = false;
      state.remotePeerId = null;
      state.remoteDisplayName = "";
      state.isLocalSpeaking = false;
      state.isRemoteSpeaking = false;
      state.isRemoteCameraOn = false;
      if (resetStatus) state.callStatus = "🟢 ພ້ອມໂທສຽງ/ວິດີໂອ (ຊື່ໂທ: " + peerIdToShortHandle(state.myPeerId) + ")";
      renderAll();
    }

    function applyAudioTrackStates() {
      if (!localAudioStream) return;
      const track = localAudioStream.getAudioTracks()[0];
      if (!track) return;
      track.enabled = state.isPTT ? (!state.isMuted && state.pttPressed) : !state.isMuted;
    }

    function toggleMute() { state.isMuted = !state.isMuted; applyAudioTrackStates(); renderAll(); }
    function toggleDeafen() {
      state.isDeafened = !state.isDeafened;
      document.getElementById("remote-audio").muted = state.isDeafened;
      renderStageBody();
    }
    function togglePTT() { state.isPTT = !state.isPTT; state.pttPressed = false; applyAudioTrackStates(); renderStageBody(); }
    function toggleVoiceChatDrawer() { state.voiceChatOpen = !state.voiceChatOpen; renderStageBody(); }

    window.addEventListener("keydown", e => {
      const tag = document.activeElement.tagName;
      if (state.isPTT && e.code === "Space" && tag !== "INPUT" && tag !== "TEXTAREA") {
        e.preventDefault();
        state.pttPressed = true;
        applyAudioTrackStates();
      }
    });
    window.addEventListener("keyup", e => {
      if (state.isPTT && e.code === "Space") {
        state.pttPressed = false;
        applyAudioTrackStates();
      }
    });

    /* ================= CHANNELS ================= */
    function canExecute(action, { targetChannelId = null } = {}) {
      const actor = state.users.me;
      if (action === "join_channel") {
        const ch = state.channels.find(c => c.id === targetChannelId);
        if (!ch) return { allowed: false, reason: "ບໍ່ພົບຫ້ອງ" };
        return actor.joinPower >= ch.neededJoinPower
          ? { allowed: true }
          : { allowed: false, reason: `ຕ້ອງການ Join Power ${ch.neededJoinPower}` };
      }
      return { allowed: true };
    }

    function selectChannel(channelId) {
      const check = canExecute("join_channel", { targetChannelId: channelId });
      if (!check.allowed) return alert("ເຂົ້າຫ້ອງບໍ່ໄດ້: " + check.reason);
      const ch = state.channels.find(c => c.id === channelId);
      state.viewMode = "channel";
      state.activeChannelId = channelId;
      if (ch && ch.type === "voice") {
        state.connectedVoiceChannelId = channelId;
        if (!state.inCall) state.callStatus = "🟢 ຢູ່ໃນຫ້ອງສຽງແລ້ວ";
      }
      state.replyTo = null;
      state.editingMessageId = null;
      state.editingPostId = null;
      state.activePostTag = "All";
      renderAll();
    }

    function joinVoiceChannel(channelId) {
      const check = canExecute("join_channel", { targetChannelId: channelId });
      if (!check.allowed) return alert("ເຂົ້າຫ້ອງບໍ່ໄດ້: " + check.reason);
      state.connectedVoiceChannelId = channelId;
      state.callStatus = "🟢 ຢູ່ໃນຫ້ອງສຽງແລ້ວ";
      renderAll();
    }

    function leaveVoiceChannel() {
      if (currentCall) currentCall.close();
      if (localAudioStream) { localAudioStream.getTracks().forEach(t => t.stop()); localAudioStream = null; }
      if (cameraStream) { cameraStream.getTracks().forEach(t => t.stop()); cameraStream = null; }
      localCombinedStream = null;
      remoteMediaStream = null;
      currentCall = null;
      state.inCall = false;
      state.isCameraOn = false;
      state.isRemoteCameraOn = false;
      state.remotePeerId = null;
      state.remoteDisplayName = "";
      state.isLocalSpeaking = false;
      state.isRemoteSpeaking = false;
      state.connectedVoiceChannelId = null;
      state.callStatus = "ອອກຈາກຫ້ອງສຽງແລ້ວ";
      renderAll();
    }

    function addChannel(type) {
      const label = type === "voice" ? "ຫ້ອງໂທສຽງ" : type === "text" ? "ຫ້ອງແຊັດ" : "ຫ້ອງໂພສ";
      const name = prompt(`ຊື່ ${label} ໃໝ່:`);
      if (!name || !name.trim()) return;

      let parentId = null;
      if (type === "voice") {
        const active = state.channels.find(c => c.id === state.activeChannelId);
        if (active && active.type === "voice") {
          const makeSub = confirm(`ຕ້ອງການສ້າງເປັນ Sub-channel ໃຕ້ "${active.name}" ບໍ່?\n(ກົດ Cancel ເພື່ອສ້າງເປັນຫ້ອງສຽງຫຼັກໃໝ່)`);
          if (makeSub) parentId = active.parentId || active.id;
        }
      }

      const id = `ch_${type}_${Date.now()}`;
      state.channels.push({ id, type, parentId, name: name.trim(), desc: `ສ້າງໃໝ່ (${label})`, neededJoinPower: 0 });
      saveChannels();
      if (type === "post") { state.postsByChannel[id] = []; savePosts(); }
      else {
        state.messagesByChannel[id] = [{ id: "sys_" + Date.now(), sender: "System", senderEmail: "", time: nowTime(), text: `ສ້າງຫ້ອງ "${name.trim()}" ແລ້ວ`, reply: null, reactions: {}, edited: false }];
        saveMessages();
      }

      state.viewMode = "channel";
      state.activeChannelId = id;
      if (type === "voice") state.connectedVoiceChannelId = id;
      renderAll();
    }

    function deleteChannel(event, channelId) {
      event.stopPropagation();
      const ch = state.channels.find(c => c.id === channelId);
      if (!ch) return;

      const sameType = state.channels.filter(c => c.type === ch.type && c.parentId === null);
      if (ch.type === "voice" && !ch.parentId && sameType.length <= 1) {
        return alert("ຕ້ອງເຫຼືອຫ້ອງສຽງຫຼັກໄວ້ຢ່າງໜ້ອຍ 1 ຫ້ອງ");
      }

      const childCount = state.channels.filter(c => c.parentId === channelId).length;
      const msg = childCount > 0
        ? `ຕ້ອງການລົບຫ້ອງ "${ch.name}" ແລະ Sub-channel ອີກ ${childCount} ຫ້ອງແທ້ບໍ່?`
        : `ຕ້ອງການລົບຫ້ອງ "${ch.name}" ແທ້ບໍ່?`;
      if (!confirm(msg)) return;

      const idsToRemove = new Set([channelId]);
      state.channels.forEach(c => { if (c.parentId === channelId) idsToRemove.add(c.id); });

      state.channels = state.channels.filter(c => !idsToRemove.has(c.id));
      saveChannels();

      if (idsToRemove.has(state.connectedVoiceChannelId)) leaveVoiceChannel();
      if (idsToRemove.has(state.activeChannelId)) {
        const fallback = state.channels[0];
        state.activeChannelId = fallback ? fallback.id : null;
      }
      renderAll();
    }

    /* ================= CHAT (CREATE / EDIT / DELETE + SYNC) ================= */
    function sendChatMessage(event) {
      event.preventDefault();
      const input = document.getElementById("chat-input");
      const text = input.value.trim();
      if (!text) return;
      const msg = {
        id: "m_" + Date.now() + "_" + Math.random().toString(36).slice(2, 6),
        sender: state.users.me.name,
        senderEmail: state.users.me.email,
        time: nowTime(),
        text,
        reply: state.replyTo,
        reactions: {},
        edited: false
      };
      const list = state.messagesByChannel[state.activeChannelId] || [];
      list.push(msg);
      state.messagesByChannel[state.activeChannelId] = list;
      saveMessages();
      sendData({ type: "chat_new", channelId: state.activeChannelId, message: msg });
      state.replyTo = null;
      input.value = "";
      renderStageBody();
    }

    function startEditMessage(msgId) {
      state.editingMessageId = msgId;
      renderStageBody();
      document.getElementById("edit-msg-input")?.focus();
    }
    function cancelEditMessage() {
      state.editingMessageId = null;
      renderStageBody();
    }
    function saveEditMessage(event, msgId) {
      event.preventDefault();
      const input = document.getElementById("edit-msg-input");
      const newText = input ? input.value.trim() : "";
      if (!newText) return;
      const list = state.messagesByChannel[state.activeChannelId] || [];
      const msg = list.find(m => m.id === msgId);
      if (!msg) return;
      msg.text = newText;
      msg.edited = true;
      state.editingMessageId = null;
      saveMessages();
      sendData({ type: "chat_edit", channelId: state.activeChannelId, msgId, text: newText });
      renderStageBody();
    }

    function deleteChatMessage(msgId) {
      if (!confirm("ຕ້ອງການລົບຂໍ້ຄວາມນີ້ແທ້ບໍ່?")) return;
      const list = state.messagesByChannel[state.activeChannelId] || [];
      state.messagesByChannel[state.activeChannelId] = list.filter(m => m.id !== msgId);
      saveMessages();
      sendData({ type: "chat_delete", channelId: state.activeChannelId, msgId });
      renderStageBody();
    }

    function setReplyTo(msgId) {
      const target = (state.messagesByChannel[state.activeChannelId] || []).find(m => m.id === msgId);
      if (!target) return;
      state.replyTo = { sender: target.sender, text: target.text };
      renderStageBody();
      document.getElementById("chat-input")?.focus();
    }
    function clearReply() { state.replyTo = null; renderStageBody(); }

    function toggleReaction(msgId, emoji) {
      const msg = (state.messagesByChannel[state.activeChannelId] || []).find(m => m.id === msgId);
      if (!msg) return;
      msg.reactions[emoji] = (msg.reactions[emoji] || 0) + 1;
      saveMessages();
      sendData({ type: "chat_react", channelId: state.activeChannelId, msgId, emoji });
      renderStageBody();
    }

    /* ================= POSTS (CREATE / EDIT / DELETE + SYNC) ================= */
    function createPost(event) {
      event.preventDefault();
      const title = document.getElementById("post-title").value.trim();
      const body = document.getElementById("post-body").value.trim();
      const tag = document.getElementById("post-tag").value;
      const imageUrl = document.getElementById("post-img").value.trim();
      if (!title || !body) return alert("ກະລຸນາໃສ່ຫົວຂໍ້ ແລະ ເນື້ອຫາໂພສ");
      const post = {
        id: "p_" + Date.now() + "_" + Math.random().toString(36).slice(2, 6),
        author: state.users.me.name,
        authorEmail: state.users.me.email,
        time: nowTime(),
        tag, title, body, imageUrl,
        likes: 0, likedByMe: false, edited: false, comments: []
      };
      const list = state.postsByChannel[state.activeChannelId] || [];
      list.unshift(post);
      state.postsByChannel[state.activeChannelId] = list;
      savePosts();
      sendData({ type: "post_new", channelId: state.activeChannelId, post });
      renderStageBody();
    }

    function startEditPost(postId) {
      state.editingPostId = postId;
      renderStageBody();
    }
    function cancelEditPost() {
      state.editingPostId = null;
      renderStageBody();
    }
    function saveEditPost(event, postId) {
      event.preventDefault();
      const post = (state.postsByChannel[state.activeChannelId] || []).find(p => p.id === postId);
      if (!post) return;
      const title = document.getElementById("edit-post-title").value.trim();
      const body = document.getElementById("edit-post-body").value.trim();
      const tag = document.getElementById("edit-post-tag").value;
      const imageUrl = document.getElementById("edit-post-img").value.trim();
      if (!title || !body) return alert("ຫົວຂໍ້ ແລະ ເນື້ອຫາຫ້າມວ່າງ");

      post.title = title;
      post.body = body;
      post.tag = tag;
      post.imageUrl = imageUrl;
      post.edited = true;
      state.editingPostId = null;
      savePosts();
      sendData({ type: "post_edit", channelId: state.activeChannelId, postId, title, body, tag, imageUrl });
      renderStageBody();
    }

    function deletePost(postId) {
      if (!confirm("ຕ້ອງການລົບໂພສນີ້ແທ້ບໍ່?")) return;
      const list = state.postsByChannel[state.activeChannelId] || [];
      state.postsByChannel[state.activeChannelId] = list.filter(p => p.id !== postId);
      savePosts();
      sendData({ type: "post_delete", channelId: state.activeChannelId, postId });
      renderStageBody();
    }

    function toggleLikePost(postId) {
      const post = (state.postsByChannel[state.activeChannelId] || []).find(p => p.id === postId);
      if (!post) return;
      post.likedByMe = !post.likedByMe;
      const delta = post.likedByMe ? 1 : -1;
      post.likes = Math.max(0, (post.likes || 0) + delta);
      savePosts();
      sendData({ type: "post_like", channelId: state.activeChannelId, postId, delta });
      renderStageBody();
    }

    function addComment(event, postId) {
      event.preventDefault();
      const input = event.target.querySelector("input");
      const text = input.value.trim();
      if (!text) return;
      const post = (state.postsByChannel[state.activeChannelId] || []).find(p => p.id === postId);
      if (!post) return;
      const comment = { id: "c_" + Date.now(), author: state.users.me.name, text };
      post.comments.push(comment);
      savePosts();
      sendData({ type: "post_comment", channelId: state.activeChannelId, postId, comment });
      renderStageBody();
    }

    function setPostTagFilter(tag) { state.activePostTag = tag; renderStageBody(); }

    /* ================= RENDERERS ================= */
    function renderChannelTree() {
      const nav = document.getElementById("channel-tree");
      nav.innerHTML = "";
      const me = state.users.me;

      document.getElementById("nav-friends").classList.toggle("active", state.viewMode === "friends");
      document.getElementById("friends-count-badge").innerText = state.friends.filter(f => !f.blocked).length;

      const groups = [
        { type: "text", title: "ຫ້ອງແຊັດ (Text)", icon: "#" },
        { type: "post", title: "ຫ້ອງໂພສ (Forum)", icon: "▤" },
        { type: "voice", title: "ຫ້ອງໂທສຽງ (Voice)", icon: "🔊" }
      ];

      groups.forEach(group => {
        const header = document.createElement("div");
        header.className = "cat-label";
        header.innerHTML = `<span>${group.title}</span><button type="button" class="cat-add" title="ສ້າງຫ້ອງໃໝ່" onclick="addChannel('${group.type}')">+</button>`;
        nav.appendChild(header);

        const renderLevel = (parentId) => {
          state.channels.filter(c => c.type === group.type && c.parentId === parentId).forEach(ch => {
            const locked = me.joinPower < ch.neededJoinPower;
            const isActive = state.viewMode === "channel" && ch.id === state.activeChannelId;
            const div = document.createElement("div");
            div.className = `channel-item ${ch.parentId ? "is-sub" : ""} ${isActive ? "active" : ""} ${locked ? "locked" : ""}`;
            div.onclick = () => selectChannel(ch.id);
            div.innerHTML = `
              <span class="channel-name">${ch.parentId ? "↳ " : group.icon + " "}${escapeHtml(ch.name)}</span>
              <span class="channel-right">
                ${ch.type === "voice" && ch.neededJoinPower > 0 ? `<span class="badge">${locked ? "🔒" : "JP"}${ch.neededJoinPower}</span>` : ""}
                <button type="button" class="ch-del-btn" title="ລົບຫ້ອງ" onclick="deleteChannel(event, '${ch.id}')">✕</button>
              </span>
            `;
            nav.appendChild(div);

            if (ch.type === "voice" && state.connectedVoiceChannelId === ch.id) {
              const occ = document.createElement("div");
              occ.className = "voice-occupants";
              occ.innerHTML = `
                <div class="voice-occ-item">
                  <span id="mini-avatar-local" class="mini-avatar ${state.isLocalSpeaking ? "speaking" : ""}">${escapeHtml(initials(me.name))}</span>
                  <span>${escapeHtml(me.name)} ${state.isMuted ? "🔇" : ""} ${state.isCameraOn ? "📹" : ""}</span>
                </div>
                ${state.inCall && state.remotePeerId ? `
                  <div class="voice-occ-item">
                    <span class="mini-avatar ${state.isRemoteSpeaking ? "speaking" : ""}">${escapeHtml(initials(getFriendNameByPeer(state.remotePeerId)))}</span>
                    <span>${escapeHtml(getFriendNameByPeer(state.remotePeerId))} ${state.isRemoteCameraOn ? "📹" : ""}</span>
                  </div>` : ""}
              `;
              nav.appendChild(occ);
            }

            renderLevel(ch.id);
          });
        };
        renderLevel(null);
      });

      const vBar = document.getElementById("voice-status-bar");
      const vName = document.getElementById("voice-status-name");
      if (vBar && vName) {
        const connCh = state.channels.find(c => c.id === state.connectedVoiceChannelId);
        if (connCh) { vName.innerText = connCh.name; vBar.classList.remove("hidden"); }
        else { vBar.classList.add("hidden"); }
      }
    }

    function renderStageHeader() {
      const actions = document.getElementById("header-actions");
      const syncPill = state.syncedPeerId
        ? `<span class="badge badge-sync">🟢 ຊິ້ງກັບ ${escapeHtml(state.syncedPeerName || getFriendNameByPeer(state.syncedPeerId))}</span>`
        : `<span class="badge">⚪ ຍັງບໍ່ໄດ້ຊິ້ງກັບໝູ່ (ໂທຫາໝູ່ເພື່ອຊິ້ງ)</span>`;

      if (state.viewMode === "friends") {
        document.getElementById("active-channel-title").innerText = "👥 ໝູ່ເພື່ອນ (Friends)";
        document.getElementById("active-channel-sub").innerText = "ເພີ່ມໝູ່ດ້ວຍຊື່ @mdc.http ແລ້ວກົດໂທຫາ ຫຼື ຊິ້ງແຊັດໄດ້ທັນທີ";
        actions.innerHTML = `
          ${syncPill}
          <button type="button" class="tag-pill ${state.friendTab === "all" ? "active" : ""}" onclick="setFriendTab('all')">ທັງໝົດ (${state.friends.filter(f => !f.blocked).length})</button>
          <button type="button" class="tag-pill ${state.friendTab === "blocked" ? "active" : ""}" onclick="setFriendTab('blocked')">ບລັອກແລ້ວ (${state.friends.filter(f => f.blocked).length})</button>
        `;
        return;
      }

      const ch = state.channels.find(c => c.id === state.activeChannelId);
      if (!ch) return;
      document.getElementById("active-channel-title").innerText = (ch.type === "voice" ? "🔊 " : ch.type === "text" ? "# " : "▤ ") + ch.name;
      document.getElementById("active-channel-sub").innerText = ch.type === "voice" ? state.callStatus : ch.desc;
      actions.innerHTML = ch.type === "voice"
        ? `${syncPill}<button type="button" class="btn-small" onclick="toggleVoiceChatDrawer()">💬 ${state.voiceChatOpen ? "ເຊື່ອງແຊັດ" : "ເປີດແຊັດ"}</button>`
        : `${syncPill}<span class="badge">${ch.type === "text" ? "Text Channel" : "Forum / Post"}</span>`;
    }

    function renderChatSection(channelId) {
      const list = state.messagesByChannel[channelId] || [];
      const me = state.users.me;

      const feedHtml = list.map(m => {
        const isMine = (m.senderEmail && m.senderEmail === me.email) || m.sender === me.name;
        const isEditing = state.editingMessageId === m.id;
        const reacts = Object.entries(m.reactions || {})
          .map(([emoji, count]) => `<button type="button" class="react-btn" onclick="toggleReaction('${m.id}','${emoji}')">${emoji} ${count}</button>`).join("");

        return `
          <div class="msg-item">
            <div class="msg-top">
              <span class="msg-meta">
                <strong>${escapeHtml(m.sender)}</strong>${escapeHtml(m.time)}
                ${m.edited ? `<span class="edited-tag">(ແກ້ໄຂແລ້ວ)</span>` : ""}
              </span>
              <div class="msg-top-btns">
                <button type="button" class="btn-small" onclick="setReplyTo('${m.id}')">ຕອບກັບ</button>
                ${isMine ? `<button type="button" class="btn-small" onclick="startEditMessage('${m.id}')">✏️ ແກ້ໄຂ</button>` : ""}
                ${isMine || m.sender === "System" ? `<button type="button" class="btn-small btn-danger-soft" onclick="deleteChatMessage('${m.id}')">🗑️ ລົບ</button>` : ""}
              </div>
            </div>
            ${m.reply ? `<div class="msg-reply-ref">↳ ${escapeHtml(m.reply.sender)}: ${escapeHtml(m.reply.text)}</div>` : ""}
            ${isEditing ? `
              <form class="inline-edit-form" onsubmit="saveEditMessage(event, '${m.id}')">
                <input id="edit-msg-input" type="text" value="${escapeHtml(m.text)}" required />
                <button type="submit" class="btn-small" style="background:var(--accent);color:#05261c;">ບັນທຶກ</button>
                <button type="button" class="btn-small" onclick="cancelEditMessage()">ຍົກເລີກ</button>
              </form>` : `<div>${escapeHtml(m.text)}</div>`}
            <div class="msg-actions">
              ${reacts}
              <button type="button" class="react-btn hover-only" onclick="toggleReaction('${m.id}','👍')">+👍</button>
              <button type="button" class="react-btn hover-only" onclick="toggleReaction('${m.id}','🔥')">+🔥</button>
            </div>
          </div>`;
      }).join("");

      return `
        <section id="chat-messages" class="chat-feed">${feedHtml || `<div class="stage-sub">ຍັງບໍ່ມີຂໍ້ຄວາມໃນຫ້ອງນີ້</div>`}</section>
        ${state.replyTo ? `<div class="reply-banner"><span>ຕອບກັບ <strong>${escapeHtml(state.replyTo.sender)}</strong>: ${escapeHtml(state.replyTo.text)}</span><button type="button" class="btn-small" onclick="clearReply()">✕</button></div>` : ""}
        <form class="chat-input-bar" onsubmit="sendChatMessage(event)">
          <input id="chat-input" type="text" placeholder="ພິມຂໍ້ຄວາມ..." autocomplete="off" />
          <button type="submit">ສົ່ງ</button>
        </form>
      `;
    }

    function renderStageBody() {
      const body = document.getElementById("stage-body");

      if (state.viewMode === "friends") {
        const list = state.friends.filter(f => state.friendTab === "blocked" ? f.blocked : !f.blocked);
        body.innerHTML = `
          <div class="friends-layout">
            <form class="add-friend-card" onsubmit="addFriend(event)">
              <strong style="font-size: 14px;">➕ ເພີ່ມໝູ່ໃໝ່ (ໃຊ້ຊື່ @mdc.http ຖາວອນ)</strong>
              <div class="add-friend-row">
                <input id="friend-name-input" type="text" placeholder="ຊື່ສະແດງ (ເຊັ່ນ Leo)" required />
                <input id="friend-handle-input" type="text" placeholder="ຊື່ໂທ (ເຊັ່ນ leo ຫຼື leo@mdc.http)" required />
                <button type="submit">ບັນທຶກໝູ່</button>
              </div>
            </form>

            ${list.map(f => `
              <div class="friend-card">
                <div class="friend-info">
                  <div class="friend-avatar">${escapeHtml(initials(f.name))}</div>
                  <div>
                    <strong>${escapeHtml(f.name)} ${f.blocked ? '<span class="badge" style="color:#fca5a5;">Blocked</span>' : ""}</strong>
                    <div class="user-email-mini">${escapeHtml(f.email || peerIdToHandle(f.peerId))}</div>
                  </div>
                </div>
                <div class="friend-actions">
                  ${!f.blocked ? `<button type="button" onclick="callFriendByHandle('${escapeHtml(f.peerId)}')">📞 ໂທຫາ</button>` : ""}
                  ${!f.blocked ? `<button type="button" class="btn-small" onclick="connectDataChannel('${escapeHtml(f.peerId)}')">💬 ຊິ້ງແຊັດ</button>` : ""}
                  <button type="button" class="btn-small" onclick="toggleBlockFriend('${f.id}')">${f.blocked ? "ປົດ Block" : "🚫 Block"}</button>
                  <button type="button" class="btn-small btn-danger-soft" onclick="removeFriend('${f.id}')">🗑️ ລົບໝູ່</button>
                </div>
              </div>
            `).join("") || `<div class="stage-sub">${state.friendTab === "blocked" ? "ຍັງບໍ່ມີລາຍຊື່ທີ່ຖືກ Block" : "ຍັງບໍ່ມີໝູ່ໃນລາຍຊື່ — ເພີ່ມຊື່ @mdc.http ຂອງໝູ່ດ້ານເທິງໄດ້ເລີຍ"}</div>`}
          </div>
        `;
        return;
      }

      const ch = state.channels.find(c => c.id === state.activeChannelId);
      if (!ch) return;

      if (ch.type === "voice") {
        const me = state.users.me;
        const activeFriends = state.friends.filter(f => !f.blocked);
        const remoteName = state.remotePeerId ? getFriendNameByPeer(state.remotePeerId) : null;
        const remoteHandleDisplay = state.remotePeerId ? peerIdToHandle(state.remotePeerId) : "";
        const isInThisVoice = state.connectedVoiceChannelId === ch.id;

        body.innerHTML = `
          <div class="voice-workspace ${state.voiceChatOpen ? "" : "chat-closed"}">
            <section class="voice-stage-col">
              <form class="voice-call-bar" onsubmit="event.preventDefault(); startCall();">
                <input id="remote-id-input" type="text" placeholder="ພິມຊື່ໝູ່ (ເຊັ່ນ leo ຫຼື leo@mdc.http)..." value="${escapeHtml(remoteHandleDisplay)}" style="flex:1; min-width:170px;" />
                ${activeFriends.length ? `
                  <select onchange="if(this.value) { document.getElementById('remote-id-input').value = this.value; startCall(this.value); }">
                    <option value="">-- ໂທຫາໝູ່ທັນທີ --</option>
                    ${activeFriends.map(f => `<option value="${escapeHtml(f.email || peerIdToHandle(f.peerId))}">${escapeHtml(f.name)}</option>`).join("")}
                  </select>` : ""}
                ${!state.inCall
                  ? `<button type="submit">📞 ໂທເຂົ້າຫ້ອງ</button>`
                  : `<button type="button" class="btn-danger" onclick="hangUp()">📵 ວາງສາຍ</button>`}
                <button type="button" class="btn-small" onclick="copyInviteLink()" title="ກັອບລິ້ງເຊີນສົ່ງໃຫ້ໝູ່">🔗 ເຊີນ</button>
                <button type="button" class="btn-small" onclick="quickAddCurrentRemoteFriend()" title="ບັນທຶກຊື່ນີ້ເປັນໝູ່">+ Add ໝູ່</button>
              </form>

              <div class="voice-tiles">
                ${isInThisVoice ? `
                  <div id="tile-local" class="voice-tile ${state.isLocalSpeaking ? "speaking" : ""}">
                    ${state.isCameraOn
                      ? `<video id="local-video" class="tile-video mirror" autoplay muted playsinline></video>`
                      : `<div class="voice-avatar">${escapeHtml(initials(me.name))}</div>`}
                    <div class="voice-tile-footer">
                      <span class="voice-name-pill">${escapeHtml(me.name)} (You)</span>
                      <span class="badge">${state.isMuted ? "🔇 Muted" : "🎙️ Live"} ${state.isCameraOn ? "• 📹" : ""} ${state.isDeafened ? "• 🔕" : ""}</span>
                    </div>
                  </div>` : `
                  <div class="voice-tile" style="opacity:0.7; border: 1px dashed var(--bg-hover); background: transparent;">
                    <div class="stage-sub" style="text-align:center;">ເຈົ້າອອກຈາກຫ້ອງ ${escapeHtml(ch.name)} ແລ້ວ<br/>ກົດປຸ່ມ "🔊 ເຂົ້າຫ້ອງສຽງ" ດ້ານລຸ່ມເພື່ອກັບເຂົ້າມາ</div>
                  </div>`}

                ${state.inCall && remoteName ? `
                  <div id="tile-remote" class="voice-tile ${state.isRemoteSpeaking ? "speaking" : ""}">
                    ${state.isRemoteCameraOn
                      ? `<video id="remote-video" class="tile-video" autoplay muted playsinline></video>`
                      : `<div class="voice-avatar">${escapeHtml(initials(remoteName))}</div>`}
                    <div class="voice-tile-footer">
                      <span class="voice-name-pill">${escapeHtml(remoteName)}</span>
                      <span class="badge">🟢 Connected ${state.isRemoteCameraOn ? "• 📹" : ""}</span>
                    </div>
                  </div>` : `
                  <div class="voice-tile" style="opacity:0.55; border: 1px dashed var(--bg-hover); background: transparent;">
                    <div class="stage-sub" style="text-align:center;">ພິມຊື່ @mdc.http ຂອງໝູ່ ຫຼື ກົດ <strong>🔗 ລິ້ງເຊີນ</strong><br/>ເພື່ອໂທສຽງ, ເປີດກ້ອງ ແລະ ຊິ້ງຂໍ້ຄວາມແບບ Real-time</div>
                  </div>`}
              </div>

              <div class="voice-dock">
                <button type="button" class="dock-btn ${state.isMuted ? "active" : ""}" onclick="toggleMute()" title="ປິດ/ເປີດໄມ">${state.isMuted ? "🔇" : "🎙️"}</button>
                <button type="button" class="dock-btn ${state.isCameraOn ? "cam-on" : ""}" onclick="toggleCamera()" title="ເປີດ/ປິດກ້ອງ">${state.isCameraOn ? "📹" : "📷"}</button>
                <button type="button" class="dock-btn ${state.isDeafened ? "active" : ""}" onclick="toggleDeafen()" title="ປິດ/ເປີດສຽງ">${state.isDeafened ? "🔕" : "🎧"}</button>
                <button type="button" class="dock-btn ${state.isPTT ? "ptt-on" : ""}" onclick="togglePTT()" title="Push-to-Talk (Space)">${state.isPTT ? "PTT: Space" : "⌨️"}</button>
                ${isInThisVoice
                  ? `<button type="button" class="dock-btn disconnect" onclick="leaveVoiceChannel()" title="ອອກຈາກຫ້ອງສຽງ">📵</button>`
                  : `<button type="button" class="dock-btn ptt-on" onclick="joinVoiceChannel('${ch.id}')">🔊 ເຂົ້າຫ້ອງສຽງ</button>`}
              </div>
            </section>

            ${state.voiceChatOpen ? `<aside class="voice-side-chat">${renderChatSection(ch.id)}</aside>` : ""}
          </div>
        `;
        attachMediaStreamsToUI();
      } else if (ch.type === "text") {
        body.innerHTML = renderChatSection(ch.id);
      } else if (ch.type === "post") {
        const allPosts = state.postsByChannel[ch.id] || [];
        const tags = ["All", "ທົ່ວໄປ", "ອັບເດດ", "ຄຳຖາມ", "ຜົນງານ"];
        const filtered = state.activePostTag === "All" ? allPosts : allPosts.filter(p => p.tag === state.activePostTag);
        const me = state.users.me;

        body.innerHTML = `
          <div class="post-layout">
            <form class="post-composer" onsubmit="createPost(event)">
              <div class="post-composer-row">
                <input id="post-title" type="text" placeholder="ຫົວຂໍ້ໂພສໃໝ່..." required />
                <select id="post-tag"><option value="ທົ່ວໄປ">ທົ່ວໄປ</option><option value="ອັບເດດ">ອັບເດດ</option><option value="ຄຳຖາມ">ຄຳຖາມ</option><option value="ຜົນງານ">ຜົນງານ</option></select>
              </div>
              <textarea id="post-body" rows="3" placeholder="ຂຽນລາຍລະອຽດໂພສ..." required></textarea>
              <div class="post-composer-row">
                <input id="post-img" type="url" placeholder="ລິ້ງຮູບພາບ (ຖ້າມີ)..." />
                <button type="submit">ໂພສໃໝ່</button>
              </div>
            </form>
            <div class="tag-bar">
              ${tags.map(t => `<button type="button" class="tag-pill ${state.activePostTag === t ? "active" : ""}" onclick="setPostTagFilter('${t}')">${t}</button>`).join("")}
            </div>
            ${filtered.map(p => {
              const canManage = (p.authorEmail && p.authorEmail === me.email) || p.author === me.name || p.author === "System";
              const isEditing = state.editingPostId === p.id;
              return `
              <article class="post-card">
                ${isEditing ? `
                  <form class="post-composer" style="padding:0; background:transparent;" onsubmit="saveEditPost(event, '${p.id}')">
                    <div class="post-composer-row">
                      <input id="edit-post-title" type="text" value="${escapeHtml(p.title)}" required />
                      <select id="edit-post-tag">
                        ${["ທົ່ວໄປ", "ອັບເດດ", "ຄຳຖາມ", "ຜົນງານ"].map(t => `<option value="${t}" ${p.tag === t ? "selected" : ""}>${t}</option>`).join("")}
                      </select>
                    </div>
                    <textarea id="edit-post-body" rows="3" required>${escapeHtml(p.body)}</textarea>
                    <div class="post-composer-row">
                      <input id="edit-post-img" type="url" value="${escapeHtml(p.imageUrl || "")}" placeholder="ລິ້ງຮູບພາບ (ຖ້າມີ)..." />
                      <button type="submit">ບັນທຶກ</button>
                      <button type="button" class="btn-small" onclick="cancelEditPost()">ຍົກເລີກ</button>
                    </div>
                  </form>
                ` : `
                  <div class="post-header">
                    <div>
                      <h3 class="post-title">${escapeHtml(p.title)} ${p.edited ? `<span class="edited-tag">(ແກ້ໄຂແລ້ວ)</span>` : ""}</h3>
                      <div class="stage-sub">ໂດຍ ${escapeHtml(p.author)} • ${escapeHtml(p.time)}</div>
                    </div>
                    <div class="post-header-right">
                      <span class="badge">${escapeHtml(p.tag)}</span>
                      ${canManage ? `<button type="button" class="btn-small" onclick="startEditPost('${p.id}')">✏️ ແກ້ໄຂ</button>` : ""}
                      ${canManage ? `<button type="button" class="btn-small btn-danger-soft" onclick="deletePost('${p.id}')">🗑️ ລົບ</button>` : ""}
                    </div>
                  </div>
                  <p class="post-body">${escapeHtml(p.body)}</p>
                  ${p.imageUrl ? `<img class="post-img" src="${escapeHtml(p.imageUrl)}" alt="post image" />` : ""}
                `}
                <div class="post-footer">
                  <button type="button" class="react-btn" onclick="toggleLikePost('${p.id}')">${p.likedByMe ? "❤️" : "🤍"} ${p.likes}</button>
                  <span class="stage-sub">💬 ${p.comments.length} ຄອມເມັ້ນ</span>
                </div>
                <div class="comment-box">
                  ${p.comments.map(c => `<div class="comment-item"><span><strong>${escapeHtml(c.author)}:</strong> ${escapeHtml(c.text)}</span></div>`).join("")}
                  <form class="comment-form" onsubmit="addComment(event, '${p.id}')">
                    <input type="text" placeholder="ຂຽນຄອມເມັ້ນ..." autocomplete="off" />
                    <button type="submit" class="btn-small">ສົ່ງ</button>
                  </form>
                </div>
              </article>`;
            }).join("") || `<div class="stage-sub">ຍັງບໍ່ມີໂພສໃນໝວດນີ້</div>`}
          </div>
        `;
      }

      const feed = document.getElementById("chat-messages");
      if (feed) feed.scrollTop = feed.scrollHeight;
    }

    function renderAll() {
      renderChannelTree();
      renderStageHeader();
      renderStageBody();
      renderInviteBanner();
    }

    function bootWorkspace() {
      const session = getSession();
      if (!session) {
        document.getElementById("auth-gate").classList.remove("hidden");
        document.getElementById("app-workspace").classList.add("hidden");
        return;
      }
      state.users.me.name = session.displayName;
      state.users.me.email = session.email;
      state.users.me.joinPower = session.joinPower ?? 50;
      state.users.me.movePower = session.movePower ?? 50;

      document.getElementById("sidebar-user-name").innerText = session.displayName;
      document.getElementById("sidebar-user-email").innerText = session.email;
      document.getElementById("auth-gate").classList.add("hidden");
      document.getElementById("app-workspace").classList.remove("hidden");

      initPeer();
      renderAll();
    }

    bootWorkspace();
  </script>
</body>
</html>
